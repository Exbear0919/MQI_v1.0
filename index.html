版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 628, "full_text": "术后二次开胸率\n定义：肺脏移植术后一个月内再次开胸的人数占同期肺脏移植总人数的比例。\n计算公式：肺脏移植术后一个月内再次开胸的人数\n术后二次开胸率= ×100%\n同期肺脏移植手术总人数\n意义：反映医疗机构肺脏移植技术水平及术后管理水平。"}, {"name": "术后3个月内感染发生率", "code": "LUT-06", "definition": "肺脏移植术后3个月内发生感染的人数占同期肺脏移植总人数的比例。", "formula": "（一）术后3个月内细菌感染发生率（LUT-06-01）。\n肺脏移植术后3个月内发生细菌感染的人数\n术后3个月内细菌感染发生率= ×100%\n同期肺脏移植手术总人数\n（二）术后3个月内真菌感染发生率（LUT-06-02）。\n肺脏移植术后3个月内发生真菌感染的人数\n术后3个月内真菌感染发生率= ×100%\n同期肺脏移植手术总人数\n（三）术后3个月内病毒感染发生率（LUT-06-03）。\n肺脏移植术后3个月内发生病毒感染的人数\n术后3个月内病毒感染发生率= ×100%\n同期肺脏移植手术总人数", "significance": "反映肺脏移植术后管理水平。", "notes": "肺脏移植术后感染主要包括细菌感染、真菌感染及病毒感染。 细菌感染包\n括血流感染、肺部感染、支气管感染、吻合口感染，常见致病菌包括多重耐药肺炎克雷\n伯菌、鲍曼不动杆菌和铜绿假单胞菌；真菌感染以曲霉感染为主，包括支气管感染、吻\n合口感染、侵袭性肺部感染和全身播散性感染；病毒感染包括CMV感染、社区获得性\n呼吸道病毒感染。其中社区获得性呼吸道病毒感染病原体包括：小RNA病毒（鼻病毒、\n肠病毒），冠状病毒科（冠状病毒），副黏病毒科（呼吸道合胞病毒、副流感病毒和肺炎\n病毒），正黏病毒科（流行性感冒病毒A、B），腺病毒科（腺病毒）。", "category": "肺脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 629, "full_text": "术后3个月内感染发生率\n定义：肺脏移植术后3个月内发生感染的人数占同期肺脏移植总人数的比例。\n计算公式：（一）术后3个月内细菌感染发生率（LUT-06-01）。\n肺脏移植术后3个月内发生细菌感染的人数\n术后3个月内细菌感染发生率= ×100%\n同期肺脏移植手术总人数\n（二）术后3个月内真菌感染发生率（LUT-06-02）。\n肺脏移植术后3个月内发生真菌感染的人数\n术后3个月内真菌感染发生率= ×100%\n同期肺脏移植手术总人数\n（三）术后3个月内病毒感染发生率（LUT-06-03）。\n肺脏移植术后3个月内发生病毒感染的人数\n术后3个月内病毒感染发生率= ×100%\n同期肺脏移植手术总人数\n意义：反映肺脏移植术后管理水平。\n说明：肺脏移植术后感染主要包括细菌感染、真菌感染及病毒感染。 细菌感染包\n括血流感染、肺部感染、支气管感染、吻合口感染，常见致病菌包括多重耐药肺炎克雷\n伯菌、鲍曼不动杆菌和铜绿假单胞菌；真菌感染以曲霉感染为主，包括支气管感染、吻\n合口感染、侵袭性肺部感染和全身播散性感染；病毒感染包括CMV感染、社区获得性\n呼吸道病毒感染。其中社区获得性呼吸道病毒感染病原体包括：小RNA病毒（鼻病毒、\n肠病毒），冠状病毒科（冠状病毒），副黏病毒科（呼吸道合胞病毒、副流感病毒和肺炎\n病毒），正黏病毒科（流行性感冒病毒A、B），腺病毒科（腺病毒）。"}, {"name": "术后6个月内气道吻合口并发症发生率", "code": "LUT-07", "definition": "肺脏移植术后6个月内发生气道吻合口并发症的人数占同期肺脏移植总人数\n的比例。", "formula": "术后6个月内发生气道吻合口并发症的\n术后6个月内气道吻\n= 肺脏移植人数 ×100%\n合口并发症发生率\n同期肺脏移植手术总人数", "significance": "反映医疗机构肺脏移植技术水平及术后管理水平。", "notes": "气道吻合并发症包括缺血坏死、裂开、狭窄和软化。", "category": "肺脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 630, "full_text": "术后6个月内气道吻合口并发症发生率\n定义：肺脏移植术后6个月内发生气道吻合口并发症的人数占同期肺脏移植总人数\n的比例。\n计算公式：术后6个月内发生气道吻合口并发症的\n术后6个月内气道吻\n= 肺脏移植人数 ×100%\n合口并发症发生率\n同期肺脏移植手术总人数\n意义：反映医疗机构肺脏移植技术水平及术后管理水平。\n说明：气道吻合并发症包括缺血坏死、裂开、狭窄和软化。"}, {"name": "诊断符合率", "code": "LUT-08", "definition": "诊断符合的人数占同期肺脏移植总人数的比例。", "formula": "肺脏移植术后病理诊断与入院诊断相符合的人数\n诊断符合率= ×100%\n同期肺脏移植总人数", "significance": "反映医疗机构肺脏移植患者入院诊断的准确性。", "notes": "诊断符合是指肺脏移植患者的术后病理诊断与入院诊断相符合。", "category": "肺脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 631, "full_text": "诊断符合率\n定义：诊断符合的人数占同期肺脏移植总人数的比例。\n计算公式：肺脏移植术后病理诊断与入院诊断相符合的人数\n诊断符合率= ×100%\n同期肺脏移植总人数\n意义：反映医疗机构肺脏移植患者入院诊断的准确性。\n说明：诊断符合是指肺脏移植患者的术后病理诊断与入院诊断相符合。"}, {"name": "术后（6月、1年、3年、5年、10年）生存率", "code": "LUT-09", "definition": "肺脏移植术后（6月、1年、3年、5年、10年）随访（失访者按未存活统\n计）尚存活的肺脏移植患者数占同期肺脏移植总人数的比例。", "formula": "肺脏移植术后（6月、1年、3年、5年、10年）\n术后（6月、1年、3年、\n= 随访尚存活的肺脏移植患者数 ×100%\n5年、10年）生存率\n同期肺脏移植总人数", "significance": "反映肺脏移植患者的近、远期疗效。", "notes": "", "category": "肺脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 632, "full_text": "术后（6月、1年、3年、5年、10年）生存率\n定义：肺脏移植术后（6月、1年、3年、5年、10年）随访（失访者按未存活统\n计）尚存活的肺脏移植患者数占同期肺脏移植总人数的比例。\n计算公式：肺脏移植术后（6月、1年、3年、5年、10年）\n术后（6月、1年、3年、\n= 随访尚存活的肺脏移植患者数 ×100%\n5年、10年）生存率\n同期肺脏移植总人数\n意义：反映肺脏移植患者的近、远期疗效。"}, {"name": "中国肺脏移植注册登记数据报送质量指标", "code": "HTS-10", "definition": "向中国肺脏移植注册系统报送数据的完整度得分与同期肺脏移植总人数的比例。", "formula": "∑每例肺脏移植手术上报数据完整度得分\n数据完整度= ×100%\n同期肺脏移植手术总人数", "significance": "反映医疗机构实施肺脏移植手术后数据报送的完整性。", "notes": "完整度得分由中国肺脏移植注册登记系统要求填报的移植手术主要参数计算。\n（二）数据及时性（HTS-10-02）。", "category": "肺脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 633, "full_text": "中国肺脏移植注册登记数据报送质量指标\n定义：向中国肺脏移植注册系统报送数据的完整度得分与同期肺脏移植总人数的比例。\n计算公式：∑每例肺脏移植手术上报数据完整度得分\n数据完整度= ×100%\n同期肺脏移植手术总人数\n意义：反映医疗机构实施肺脏移植手术后数据报送的完整性。\n说明：完整度得分由中国肺脏移植注册登记系统要求填报的移植手术主要参数计算。\n（二）数据及时性（HTS-10-02）。"}, {"name": "肝癌肝脏移植指标", "code": "LIT-01", "definition": "肝癌肝脏移植受者人数占同期肝脏移植手术受者总人数的比例。", "formula": "肝癌肝脏移植受者人数\n肝癌肝脏移植受者比例= ×100%\n同期肝脏移植手术受者总人数\n（二）单发肿瘤，直径不超过5cm的肝癌肝脏移植受者比例（LIT-01-02）。", "significance": "反映医疗机构肝癌肝脏移植受者情况。", "notes": "", "category": "肝脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 634, "full_text": "肝癌肝脏移植指标\n定义：肝癌肝脏移植受者人数占同期肝脏移植手术受者总人数的比例。\n计算公式：肝癌肝脏移植受者人数\n肝癌肝脏移植受者比例= ×100%\n同期肝脏移植手术受者总人数\n（二）单发肿瘤，直径不超过5cm的肝癌肝脏移植受者比例（LIT-01-02）。\n意义：反映医疗机构肝癌肝脏移植受者情况。"}, {"name": "肝脏移植手术指标", "code": "LIT-02", "definition": "冷缺血时间比例为冷缺血时间在不超过6小时（h），6-12h和12h以上三个\n时间段中的肝脏移植手术人数分别占同期肝脏移植手术总人数的比例。", "formula": "1.冷缺血时间≤6h比例（LIT-02-01A）。\n冷缺血时间不超过6h的手术人数\n冷缺血时间≤6h比例= ×100%\n同期肝脏移植手术总人数\n2.6h＜冷缺血时间≤12h比例（LIT-02-01B）。\n冷缺血时间在6-12h的手术人数\n6h＜冷缺血时间≤12h比例= ×100%\n同期肝脏移植手术总人数\n3.冷缺血时间＞12h比例（LIT-02-01C）。\n冷缺血时间12h以上的手术人数\n冷缺血时间＞12h比例= ×100%\n同期肝脏移植手术总人数\n（二）无肝期比例（LIT-02-02）。", "significance": "通过监测手术相关指标，进行医疗机构横向和纵向比较了解本医疗机构手术\n安全情况。", "notes": "", "category": "肝脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 635, "full_text": "肝脏移植手术指标\n定义：冷缺血时间比例为冷缺血时间在不超过6小时（h），6-12h和12h以上三个\n时间段中的肝脏移植手术人数分别占同期肝脏移植手术总人数的比例。\n计算公式：1.冷缺血时间≤6h比例（LIT-02-01A）。\n冷缺血时间不超过6h的手术人数\n冷缺血时间≤6h比例= ×100%\n同期肝脏移植手术总人数\n2.6h＜冷缺血时间≤12h比例（LIT-02-01B）。\n冷缺血时间在6-12h的手术人数\n6h＜冷缺血时间≤12h比例= ×100%\n同期肝脏移植手术总人数\n3.冷缺血时间＞12h比例（LIT-02-01C）。\n冷缺血时间12h以上的手术人数\n冷缺血时间＞12h比例= ×100%\n同期肝脏移植手术总人数\n（二）无肝期比例（LIT-02-02）。\n意义：通过监测手术相关指标，进行医疗机构横向和纵向比较了解本医疗机构手术\n安全情况。"}, {"name": "术后主要并发症指标", "code": "LIT-03", "definition": "肝脏移植手术后发生EAD的手术人数占同期肝脏移植手术总人数的比例。", "formula": "发生EAD的手术人数\n术后EAD发生率= ×100%\n同期肝脏移植手术总人数", "significance": "反映的是术后并发症发生比例，用于评价医疗机构肝脏移植技术的安全性，\n通过同级别医疗机构的横向比较，以及不同时间的纵向比较及时发现术后并发症的现状、\n趋势及危险因素，为其预防、控制和制定质量改进目标提供科学依据，提升医疗机构肝\n脏移植技术水平和术后管理质量。", "notes": "符合下列一个或多个标准的病例视为发生EAD：\n（1）术后第7天总胆红素（TB）≥171 umol/L（10mg/dL）。\n（2）术后第7天国际标准化比值（INR）≥1.6（应用抗凝药物原因除外）。\n（3）术后7天内谷丙转氨酶（ALT）或谷草转氨酶（AST）>2000 IU/L。\n（二）术后非计划二次手术率（LIT-03-02）。", "category": "肝脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 636, "full_text": "术后主要并发症指标\n定义：肝脏移植手术后发生EAD的手术人数占同期肝脏移植手术总人数的比例。\n计算公式：发生EAD的手术人数\n术后EAD发生率= ×100%\n同期肝脏移植手术总人数\n意义：反映的是术后并发症发生比例，用于评价医疗机构肝脏移植技术的安全性，\n通过同级别医疗机构的横向比较，以及不同时间的纵向比较及时发现术后并发症的现状、\n趋势及危险因素，为其预防、控制和制定质量改进目标提供科学依据，提升医疗机构肝\n脏移植技术水平和术后管理质量。\n说明：符合下列一个或多个标准的病例视为发生EAD：\n（1）术后第7天总胆红素（TB）≥171 umol/L（10mg/dL）。\n（2）术后第7天国际标准化比值（INR）≥1.6（应用抗凝药物原因除外）。\n（3）术后7天内谷丙转氨酶（ALT）或谷草转氨酶（AST）>2000 IU/L。\n（二）术后非计划二次手术率（LIT-03-02）。"}, {"name": "受者术后生存指标", "code": "LIT-04", "definition": "肝脏移植术后30天内受者全因死亡人数占同期肝脏移植手术受者总人数的比例。", "formula": "肝脏移植术后30天内受者全因死亡人数\n术后早期死亡率= ×100%\n同期肝脏移植手术受者总人数\n（二）受者术后生存率（1年、3年、5年）（LIT-04-02）。", "significance": "反映肝脏移植的中远期疗效，与医疗机构手术技术、术后医疗管理质量等情\n况密切相关，与同级医疗机构进行横向比较，评价医疗机构肝脏移植医疗技术与术后管\n理质量。", "notes": "", "category": "肝脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 637, "full_text": "受者术后生存指标\n定义：肝脏移植术后30天内受者全因死亡人数占同期肝脏移植手术受者总人数的比例。\n计算公式：肝脏移植术后30天内受者全因死亡人数\n术后早期死亡率= ×100%\n同期肝脏移植手术受者总人数\n（二）受者术后生存率（1年、3年、5年）（LIT-04-02）。\n意义：反映肝脏移植的中远期疗效，与医疗机构手术技术、术后医疗管理质量等情\n况密切相关，与同级医疗机构进行横向比较，评价医疗机构肝脏移植医疗技术与术后管\n理质量。"}, {"name": "中国肝移植注册系统（CLTR）数据报送质量指标", "code": "LIT-05", "definition": "向CLTR系统所报送数据的完整度累计值与同期肝脏移植总人数的比例。", "formula": "∑每例肝脏移植病例数据完整度得分\n数据完整度= ×100%\n同期肝脏移植总人数\n（二）数据及时性（LIT-05-02）。", "significance": "数据及时性、完整度和真实性反映医疗机构实施肝脏移植手术后数据报送的\n规范性、及时程度和数据质量以及医疗机构管理水平。提高数据质量有助于提高对各项\n指标分析的准确性，更明确地了解肝脏移植技术的现状和趋势，进行针对性的改进。长\n期随访与受者的中远期治疗密切相关，有效随访率和失访率，反映医疗机构肝脏移植术\n后中远期管理水平。", "notes": "数据真实性采取加权赋分，依据以下两项内容进行考察，各占50%：\n（1）查看所有病例相关数据报送情况是否合理，例如身高、体重、热缺血时间、冷\n缺血时间、手术时间、无肝期时间等重要参数是否在合理的阈值。\n（2）按比例随机抽取各移植中心报送CLTR系统的肝脏移植病例，数据管理员提供\n所抽取病例的生存情况证明（如最近一次检查化验单）上交至国家肝脏移植质控中心，\n根据重要参数比对情况给出真实性得分。各中心随机抽取病例数的标准如下图：\n肝脏移植受者真实性抽取例数标准\n统计时段内移植总数（例） 抽取比例（%） 抽取总数（例）\n＜10 100 --\n10-50 -- 10\n50-100 20 --\n＞100 -- 20\n（四）有效随访率（LIT-05-04）。", "category": "肝脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": ["<table class=\"indicator-table\">\n<tr><th>术后时间</th><th>时间段末应随访次数</th></tr>\n<tr><td>1月</td><td>4次</td></tr>\n<tr><td>1-3月</td><td>8次</td></tr>\n<tr><td>3-6月</td><td>11次</td></tr>\n<tr><td>6-12月</td><td>14次</td></tr>\n<tr><td>1-2年</td><td>18次</td></tr>\n<tr><td>2-5年</td><td>24次</td></tr>\n<tr><td>＞5年</td><td>**</td></tr>\n</table>", "<table class=\"indicator-table\">\n<tr><th>统计时段内移植总数（例）</th><th>抽取比例（%）</th><th>抽取总数（例）</th></tr>\n<tr><td>＜10</td><td>100</td><td>--</td></tr>\n<tr><td>10-50</td><td>--</td><td>10</td></tr>\n<tr><td>50-100</td><td>20</td><td>--</td></tr>\n<tr><td>＞100</td><td>--</td><td>20</td></tr>\n</table>"], "sub_indicators": [], "id": 638, "full_text": "中国肝移植注册系统（CLTR）数据报送质量指标\n定义：向CLTR系统所报送数据的完整度累计值与同期肝脏移植总人数的比例。\n计算公式：∑每例肝脏移植病例数据完整度得分\n数据完整度= ×100%\n同期肝脏移植总人数\n（二）数据及时性（LIT-05-02）。\n意义：数据及时性、完整度和真实性反映医疗机构实施肝脏移植手术后数据报送的\n规范性、及时程度和数据质量以及医疗机构管理水平。提高数据质量有助于提高对各项\n指标分析的准确性，更明确地了解肝脏移植技术的现状和趋势，进行针对性的改进。长\n期随访与受者的中远期治疗密切相关，有效随访率和失访率，反映医疗机构肝脏移植术\n后中远期管理水平。\n说明：数据真实性采取加权赋分，依据以下两项内容进行考察，各占50%：\n（1）查看所有病例相关数据报送情况是否合理，例如身高、体重、热缺血时间、冷\n缺血时间、手术时间、无肝期时间等重要参数是否在合理的阈值。\n（2）按比例随机抽取各移植中心报送CLTR系统的肝脏移植病例，数据管理员提供\n所抽取病例的生存情况证明（如最近一次检查化验单）上交至国家肝脏移植质控中心，\n根据重要参数比对情况给出真实性得分。各中心随机抽取病例数的标准如下图：\n肝脏移植受者真实性抽取例数标准\n统计时段内移植总数（例） 抽取比例（%） 抽取总数（例）\n＜10 100 --\n10-50 -- 10\n50-100 20 --\n＞100 -- 20\n（四）有效随访率（LIT-05-04）。"}, {"name": "冷热缺血时间", "code": "KTS-01", "definition": "热缺血时间≤ 10分钟（min）、冷缺血时间≤ 24小时（h）的肾脏移植人数\n分别占同期肾脏移植总人数的比例。", "formula": "（一）热缺血时间≤10min的比例（KTS-01A）。\n热缺血时间≤10min的人数\n热缺血时间≤10min的比例= ×100%\n同期肾脏移植总人数\n（二）冷缺血时间≤24h的比例（KTS-01B）。\n冷缺血时间≤24h的人数\n冷缺血时间≤24h的比例= ×100%\n同期肾脏移植总人数", "significance": "反映医疗机构肾脏移植技术水平和团队工作效率的重要过程指标之一。", "notes": "（1）热缺血时间：从供体心跳停止或肾动脉阻断（亲属间活体捐献）到冷灌\n注的时间。\n（2）冷缺血时间：从供肾冷灌注开始到植入体内恢复血液再灌注的时间。", "category": "肾脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 639, "full_text": "冷热缺血时间\n定义：热缺血时间≤ 10分钟（min）、冷缺血时间≤ 24小时（h）的肾脏移植人数\n分别占同期肾脏移植总人数的比例。\n计算公式：（一）热缺血时间≤10min的比例（KTS-01A）。\n热缺血时间≤10min的人数\n热缺血时间≤10min的比例= ×100%\n同期肾脏移植总人数\n（二）冷缺血时间≤24h的比例（KTS-01B）。\n冷缺血时间≤24h的人数\n冷缺血时间≤24h的比例= ×100%\n同期肾脏移植总人数\n意义：反映医疗机构肾脏移植技术水平和团队工作效率的重要过程指标之一。\n说明：（1）热缺血时间：从供体心跳停止或肾动脉阻断（亲属间活体捐献）到冷灌\n注的时间。\n（2）冷缺血时间：从供肾冷灌注开始到植入体内恢复血液再灌注的时间。"}, {"name": "亲属间活体捐献者重大并发症发生率", "code": "KTS-02", "definition": "亲属间活体肾脏捐献者，术后30天内发生的重大并发症的人数占同期亲属\n间活体肾脏捐献者总人数的比例。", "formula": "亲属间活体捐献者 亲属间活体器官捐献者术后30天内重大并发症发生人数\n= ×100%\n重大并发症发生率 同期亲属活体肾脏移植总人数", "significance": "反映医疗机构亲属间活体肾脏移植技术水平和安全性的重要结果指标之一。", "notes": "亲属间活体捐献者重大并发症包括围手术期死亡和2000ml以上的大出血。", "category": "肾脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 640, "full_text": "亲属间活体捐献者重大并发症发生率\n定义：亲属间活体肾脏捐献者，术后30天内发生的重大并发症的人数占同期亲属\n间活体肾脏捐献者总人数的比例。\n计算公式：亲属间活体捐献者 亲属间活体器官捐献者术后30天内重大并发症发生人数\n= ×100%\n重大并发症发生率 同期亲属活体肾脏移植总人数\n意义：反映医疗机构亲属间活体肾脏移植技术水平和安全性的重要结果指标之一。\n说明：亲属间活体捐献者重大并发症包括围手术期死亡和2000ml以上的大出血。"}, {"name": "术后30天内死亡率", "code": "KTS-03", "definition": "肾脏移植术后30天内受者全因死亡人数占同期肾脏移植总人数的比例。", "formula": "肾脏移植术后30天内受者全因死亡人数\n术后30天死亡率= ×100%\n同期肾脏移植总人数", "significance": "体现肾脏移植手术操作的水平与近期治疗效果，用于评价医疗机构肾脏移植\n技术的安全性，是反映医疗机构肾脏移植技术水平的重要结果指标之一。", "notes": "", "category": "肾脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 641, "full_text": "术后30天内死亡率\n定义：肾脏移植术后30天内受者全因死亡人数占同期肾脏移植总人数的比例。\n计算公式：肾脏移植术后30天内受者全因死亡人数\n术后30天死亡率= ×100%\n同期肾脏移植总人数\n意义：体现肾脏移植手术操作的水平与近期治疗效果，用于评价医疗机构肾脏移植\n技术的安全性，是反映医疗机构肾脏移植技术水平的重要结果指标之一。"}, {"name": "移植肾功能延迟恢复发生率", "code": "KTS-04", "definition": "肾脏移植术后发生移植肾功能延迟恢复（DGF）的受者人数占同期肾脏移植\n总人数的比例。", "formula": "肾脏移植术后发生DGF受者人数\nDGF发生率= ×100%\n同期肾脏移植总人数", "significance": "是反映医疗机构肾脏移植技术水平的重要过程指标之一。", "notes": "DGF是指肾脏移植术后一周内需要透析治疗或术后一周血肌酐未下降至\n400μmoI/L以下。", "category": "肾脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 642, "full_text": "移植肾功能延迟恢复发生率\n定义：肾脏移植术后发生移植肾功能延迟恢复（DGF）的受者人数占同期肾脏移植\n总人数的比例。\n计算公式：肾脏移植术后发生DGF受者人数\nDGF发生率= ×100%\n同期肾脏移植总人数\n意义：是反映医疗机构肾脏移植技术水平的重要过程指标之一。\n说明：DGF是指肾脏移植术后一周内需要透析治疗或术后一周血肌酐未下降至\n400μmoI/L以下。"}, {"name": "血管并发症发生率", "code": "KTS-05", "definition": "肾脏移植术后1年内发生血管并发症的受者人数占同期肾脏移植总人数的比例。", "formula": "肾脏移植术后1年内发生血管并发症的受者人数\n血管并发症发生率= ×100%\n同期肾脏移植总人数", "significance": "是反映医疗机构肾脏移植技术水平的重要过程指标之一。", "notes": "肾脏移植术后血管并发症主要包括：移植肾动静脉破裂和血栓、移植肾动脉\n狭窄、移植肾动脉瘤。", "category": "肾脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 643, "full_text": "血管并发症发生率\n定义：肾脏移植术后1年内发生血管并发症的受者人数占同期肾脏移植总人数的比例。\n计算公式：肾脏移植术后1年内发生血管并发症的受者人数\n血管并发症发生率= ×100%\n同期肾脏移植总人数\n意义：是反映医疗机构肾脏移植技术水平的重要过程指标之一。\n说明：肾脏移植术后血管并发症主要包括：移植肾动静脉破裂和血栓、移植肾动脉\n狭窄、移植肾动脉瘤。"}, {"name": "急性排斥反应发生率", "code": "KTS-06", "definition": "肾脏移植术后1年内发生急性排斥反应受者人数占同期肾脏移植总人数的比例。", "formula": "肾脏移植术后1年内发生急性排斥反应受者人数\n急性排斥反应发生率= ×100%\n同期肾脏移植总人数", "significance": "反映医疗机构对肾脏移植术后急性排斥反应的防治水平，是体现医疗机构肾\n脏移植技术水平的重要过程指标之一。", "notes": "急性排斥反应，是肾脏移植术后最常见的一种排斥反应，一般发生在肾脏移\n植术后几个小时至6个月内，临床上表现为发热、全身不适、移植肾肿大和疼痛，同时\n伴有移植肾功能突然减退。", "category": "肾脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 644, "full_text": "急性排斥反应发生率\n定义：肾脏移植术后1年内发生急性排斥反应受者人数占同期肾脏移植总人数的比例。\n计算公式：肾脏移植术后1年内发生急性排斥反应受者人数\n急性排斥反应发生率= ×100%\n同期肾脏移植总人数\n意义：反映医疗机构对肾脏移植术后急性排斥反应的防治水平，是体现医疗机构肾\n脏移植技术水平的重要过程指标之一。\n说明：急性排斥反应，是肾脏移植术后最常见的一种排斥反应，一般发生在肾脏移\n植术后几个小时至6个月内，临床上表现为发热、全身不适、移植肾肿大和疼痛，同时\n伴有移植肾功能突然减退。"}, {"name": "术后感染发生率", "code": "KTS-07", "definition": "肾脏移植术后100天内发生感染的受者人数占同期肾脏移植总人数的比例。", "formula": "肾脏移植术后100天内发生感染的受者人数\n术后感染发生率= ×100%\n同期肾脏移植总人数", "significance": "体现医疗机构对肾脏移植术后感染的防治水平，是反映医疗机构肾脏移植技\n术水平的重要过程指标之一。", "notes": "肾脏移植术后无症状的下尿路感染不在统计之列。", "category": "肾脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 645, "full_text": "术后感染发生率\n定义：肾脏移植术后100天内发生感染的受者人数占同期肾脏移植总人数的比例。\n计算公式：肾脏移植术后100天内发生感染的受者人数\n术后感染发生率= ×100%\n同期肾脏移植总人数\n意义：体现医疗机构对肾脏移植术后感染的防治水平，是反映医疗机构肾脏移植技\n术水平的重要过程指标之一。\n说明：肾脏移植术后无症状的下尿路感染不在统计之列。"}, {"name": "中国肾脏移植科学登记系统（CSRKT）数据报送质量指标", "code": "KTS-08", "definition": "向CSRKT系统报送数据的完整度得分累计值与同期肾脏移植总人数的比例。", "formula": "所有病例的完整度得分累计值\n数据完整度= ×100%\n同期肾脏移植总人数", "significance": "反映医疗机构实施肾脏移植手术后数据报送的完整性。", "notes": "每例肾脏移植报送数据的完整度得分=（实际录入的重要参数的数量/规定\n录入的重要参数总数量）×100%。\n（二）数据及时性（KTS-08-02）。", "category": "肾脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 646, "full_text": "中国肾脏移植科学登记系统（CSRKT）数据报送质量指标\n定义：向CSRKT系统报送数据的完整度得分累计值与同期肾脏移植总人数的比例。\n计算公式：所有病例的完整度得分累计值\n数据完整度= ×100%\n同期肾脏移植总人数\n意义：反映医疗机构实施肾脏移植手术后数据报送的完整性。\n说明：每例肾脏移植报送数据的完整度得分=（实际录入的重要参数的数量/规定\n录入的重要参数总数量）×100%。\n（二）数据及时性（KTS-08-02）。"}, {"name": "移植肾生存率", "code": "KTS-09", "definition": "接受肾脏移植手术后，在某段时间（1年、3年、5年等），移植肾脏的生存率。", "formula": "采用乘积极限法（Kaplan-Meier法）计算。", "significance": "体现医疗机构对肾脏移植术后受者的综合管理水平，是反映医疗机构肾脏移\n植技术水平的重要结果指标之一。", "notes": "生存率需要和生存概率加以区别。例如：已知某医疗机构在术后1年内，有\n98例移植肾尚有功能，将其除以当年移植总人数（若为100例），即可得出该机构的一\n年移植肾生存概率为98%。但由于没有引入具体的移植肾存活时间，生存概率不能反映\n移植肾的存活随着时间的变化情况。而生存分析中则能很好地解决这个问题。将医疗机\n构上报的移植肾失功的病例、相应的术后失功时间导入统计软件，采用Kaplan-Meier法，\n进行复杂运算后得出该机构在术后不同时间内的移植肾生存率。\n心脏移植技术\n医疗质量控制指标（2020 年版）", "category": "心脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 647, "full_text": "移植肾生存率\n定义：接受肾脏移植手术后，在某段时间（1年、3年、5年等），移植肾脏的生存率。\n计算公式：采用乘积极限法（Kaplan-Meier法）计算。\n意义：体现医疗机构对肾脏移植术后受者的综合管理水平，是反映医疗机构肾脏移\n植技术水平的重要结果指标之一。\n说明：生存率需要和生存概率加以区别。例如：已知某医疗机构在术后1年内，有\n98例移植肾尚有功能，将其除以当年移植总人数（若为100例），即可得出该机构的一\n年移植肾生存概率为98%。但由于没有引入具体的移植肾存活时间，生存概率不能反映\n移植肾的存活随着时间的变化情况。而生存分析中则能很好地解决这个问题。将医疗机\n构上报的移植肾失功的病例、相应的术后失功时间导入统计软件，采用Kaplan-Meier法，\n进行复杂运算后得出该机构在术后不同时间内的移植肾生存率。\n心脏移植技术\n医疗质量控制指标（2020 年版）"}, {"name": "伦理委员会决议通过率", "code": "HTS-01", "definition": "单位时间内，术前经医疗机构伦理委员会讨论通过的心脏移植患者数占心脏\n移植总人数的比例。", "formula": "通过伦理委员会讨论的心脏移植手术人数\n伦理委员会决议通过率= ×100%\n同期心脏移植手术总人数", "significance": "该指标反映医疗机构实施心脏移植手术的规范性。", "notes": "具备心脏移植机构的单位必须根据相关规定成立器官移植技术临床应用伦理\n委员会，在实施心脏移植手术前，需要经过伦理委员会充分论证实施手术的合理性和必\n要性。", "category": "心脏移植技术医疗质量控制指标（2020年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 648, "full_text": "伦理委员会决议通过率\n定义：单位时间内，术前经医疗机构伦理委员会讨论通过的心脏移植患者数占心脏\n移植总人数的比例。\n计算公式：通过伦理委员会讨论的心脏移植手术人数\n伦理委员会决议通过率= ×100%\n同期心脏移植手术总人数\n意义：该指标反映医疗机构实施心脏移植手术的规范性。\n说明：具备心脏移植机构的单位必须根据相关规定成立器官移植技术临床应用伦理\n委员会，在实施心脏移植手术前，需要经过伦理委员会充分论证实施手术的合理性和必\n要性。"}, {"name": "术前有创肺动脉压监测率\u0007", "code": "HTS 死、食道穿孔。皮肤溃疡发生率仅用于浅表肿瘤放射性粒子植入病例。放射性肺炎发\n生率仅用于肺部实体肿瘤放射性粒子植入病例。 放射性脊髓炎发生率仅用于骨组织或\n其邻近组织实体肿瘤放射性粒子植入病例。 放射性膀胱炎发生率仅用于盆腔实体肿瘤\n放射性粒子植入病例。 放射性肠炎发生率仅用于腹腔脏器肿瘤放射性粒子植入病例。\n放射性脑坏死发生率仅用于颅内肿瘤放射性粒子植入病例。 食道穿孔发生率仅用于食\n管粒子支架植入病例。\n3.实体瘤疗效评价新标准主要包括以下几项：\n（1）完全缓解：所有靶病灶消失，无新病灶出现，且肿瘤标志物正常，至少维持4周。\n（2）部分缓解：靶病灶最大径之和减少≥30%，至少维持4周。\n（3）肿瘤稳定：靶病灶最大径之和缩小未达到部分缓解，或增大未达到肿瘤进展。\n（4）肿瘤进展：靶病灶最大径之和至少增加20%，或者出现新病灶。\n4.放射性粒子植入治疗随访的国际标准：治疗后半年内每2个月1次，治疗后半年\n至2年内每3个月1次，治疗后2年到5年每半年1次，5年后每年1次。", "notes": "", "category": "放射性粒子植入治疗技术临床应用质量控制指标（2022年版）", "type": "医疗技术类", "tables_html": [], "sub_indicators": [], "id": 715, "full_text": "患者术后生存率\n定义：放射性粒子植入治疗后某一时间（2个月、6个月、1年）随访（失访者按未\n存活患者统计）尚存活的患者数占同期放射性粒子植入治疗患者总数的比例。\n计算方法：\n放射性粒子植入治疗后某一时间随访尚存活的患者数\n患者术后生存率= ×100%\n同期放射性粒子植入治疗患者总数\n意义：反映医疗机构开展放射性粒子植入治疗的长期治疗效果。\n注：\n1.应用放射性粒子植入治疗技术应当符合肿瘤临床分期的诊断指标，包括：\n（1）局部晚期肿瘤已失去手术机会（前列腺癌除外）。\n（2）肿瘤最大径≤7cm。\n（3）手术后、放疗后肿瘤复发或转移，肿瘤转移灶数目≤ 5个，单个转移灶直径\n≤5cm。\n（4）患者一般身体状况卡氏评分70分以上。\n（5）拟经皮穿刺者有进针路径。\n（6）肿瘤空腔脏器（食道、胆道、门静脉等）出现恶性梗阻。\n（7）无严重穿刺禁忌证。\n（8）患者预计生存期≥3个月。\n（9）患者拒绝其他治疗。\n1-3项指标中至少符合2项，且4-9项指标中至少符合3项即为适应证选择正确。\n2.主要并发症包括穿刺相关和放射性损伤相关并发症。\n（1）穿刺相关主要并发症包括与穿刺相关的感染、出血、气胸、神经损伤。气胸发\n生率仅用于肺部实体肿瘤放射性粒子植入病例。神经损伤发生率仅用于坐骨神经等周围\n神经干区域肿瘤放射性粒子植入病例。\n（2）放射性粒子植入治疗可能造成粒子植入区域及周围小范围组织放射性损伤，\n主要包括皮肤溃疡、放射性肺炎、放射性脊髓炎、放射性膀胱炎、放射性肠炎、脑坏\n死、食道穿孔。皮肤溃疡发生率仅用于浅表肿瘤放射性粒子植入病例。放射性肺炎发\n生率仅用于肺部实体肿瘤放射性粒子植入病例。 放射性脊髓炎发生率仅用于骨组织或\n其邻近组织实体肿瘤放射性粒子植入病例。 放射性膀胱炎发生率仅用于盆腔实体肿瘤\n放射性粒子植入病例。 放射性肠炎发生率仅用于腹腔脏器肿瘤放射性粒子植入病例。\n放射性脑坏死发生率仅用于颅内肿瘤放射性粒子植入病例。 食道穿孔发生率仅用于食\n管粒子支架植入病例。\n3.实体瘤疗效评价新标准主要包括以下几项：\n（1）完全缓解：所有靶病灶消失，无新病灶出现，且肿瘤标志物正常，至少维持4周。\n（2）部分缓解：靶病灶最大径之和减少≥30%，至少维持4周。\n（3）肿瘤稳定：靶病灶最大径之和缩小未达到部分缓解，或增大未达到肿瘤进展。\n（4）肿瘤进展：靶病灶最大径之和至少增加20%，或者出现新病灶。\n4.放射性粒子植入治疗随访的国际标准：治疗后半年内每2个月1次，治疗后半年\n至2年内每3个月1次，治疗后2年到5年每半年1次，5年后每年1次。"}, {"name": "肿瘤消融治疗指征正确率", "code": "", "definition": "实施肿瘤消融治疗的患者，符合治疗指征的例次数占同期肿瘤消融治疗总例\n次数的比例（见注1）。", "formula": "符合治疗指征的例次数\n肿瘤消融治疗指征正确率= ×100%\n同期肿瘤消融治疗总例次数", "significance": "反映医疗机构肿瘤消融治疗技术的规范性。", "notes": "", "category": "肿瘤消融治疗技术临床应用质量控制指标（2022年版）", "type": "医疗技术类", "tables_html": "tables_html": [], "sub_indicators": [], "id": 774, "full_text": "边缘供器官比率\n定义：边缘供器官（定义和标准见备注）数量占同期获取器官总数的比例。\n计算公式：边缘供器官数量\n边缘供器官比率（%）= ×100%\n同期获取器官总数\n意义：评估OPO产出器官质量。"}, {"name": "器官保存液病原菌培养阳性率", "code": "", "definition": "OPO获取的器官其保存液中病原菌培养阳性者器官数占器官获取总例数的比例。", "formula": "病原菌培养阳性者指数\n器官保存液病原菌阳性率（%）= ×100%\n同期获取器官总例数", "significance": "反映获取器官的安全性。", "notes": "", "category": "人体器官获取组织质量控制指标", "type": "其他", "tables_html": [], "sub_indicators": [], "id": 775, "full_text": "器官保存液病原菌培养阳性率\n定义：OPO获取的器官其保存液中病原菌培养阳性者器官数占器官获取总例数的比例。\n计算公式：病原菌培养阳性者指数\n器官保存液病原菌阳性率（%）= ×100%\n同期获取器官总例数\n意义：反映获取器官的安全性。"}, {"name": "移植器官原发性无功能发生率（PNF 发生率）", "code": "", "definition": "同年度捐献器官移植术后PNF并发症发生比例，包括总PNF发生率、DBD\n来源器官PNF发生率、DCD来源器官PNF发生率、DBCD来源器官PNF发生率。", "formula": "年度PNF病例数\n总PNF发生率（%）= ×100%\n同期移植病例总数\n年度（DBD/DCD/DBCD）PNF病例数\n（DBD/DCD/DBCD）PNF发生（%）= ×100%\n同期（DBD/DCD/DBCD）移植病例总数", "significance": "反映OPO器官维护、质量评估能力。", "notes": "", "category": "人体器官获取组织质量控制指标", "type": "其他", "tables_html": [], "sub_indicators": [], "id": 776, "full_text": "移植器官原发性无功能发生率（PNF 发生率）\n定义：同年度捐献器官移植术后PNF并发症发生比例，包括总PNF发生率、DBD\n来源器官PNF发生率、DCD来源器官PNF发生率、DBCD来源器官PNF发生率。\n计算公式：年度PNF病例数\n总PNF发生率（%）= ×100%\n同期移植病例总数\n年度（DBD/DCD/DBCD）PNF病例数\n（DBD/DCD/DBCD）PNF发生（%）= ×100%\n同期（DBD/DCD/DBCD）移植病例总数\n意义：反映OPO器官维护、质量评估能力。"}, {"name": "移植器官术后功能延迟性恢复发生率（DGF 发生率）", "code": "", "definition": "同年度捐献器官移植术后DGF并发症发生比例，包括总DGF发生率、DBD\n来源器官DGF发生率、DCD来源器官DGF发生率、DBCD来源器官DGF发生率。", "formula": "年度DGF病例数\n总DGF发生率（%）= ×100%\n同期移植病例总数\n年度（DBD/DCD/DBCD）DGF病例数\n（DBD/DCD/DBCD）DGF发生（%）= ×100%\n同期（DBD/DCD/DBCD）移植病例总数", "significance": "反映OPO器官维护、质量评估能力。", "notes": "边缘供器官定义及标准\n边缘供器官是指移植后存在较高原发性移植物无功能或功能低下以及迟发性移植物\n失活风险的捐献器官。\n（一）边缘供肝标准。\n具有下列特征之一的属于边缘供肝：\n1.年龄＞65岁的捐献者肝脏；\n2.供肝大泡性脂肪变＞30%或捐献者身体质量指数（BMI）＞30kg/m2；\n3.心脏死亡捐献者肝脏或脑心双死亡捐献者肝脏（功能性热缺血时间＞20分钟），\n或供肝冷缺血时间＞12小时；\n4.脑死亡供体中在重症监护病房所待时间＞7天，且获取时有多器官功能不全，血\n清总胆红素、血清转氨酶持续高于正常3倍以上；\n5.血流动力学的危险因素，包括：长期的低血压（舒张压＜60mmHg，＞2小时），\n应用多巴胺10μg/（kg•min），超过6小时以维持血压；或需要2种缩血管药物维持血压\n达6小时以上；\n6.血钠浓度始终高于155mmol/L。\n此外，ABO血型不相容供肝、劈裂式供肝以及血清病毒学阳性、不能解释病死原\n因、患有肝外恶性疾病、活动性的细菌感染、高风险的生活方式等捐献肝脏也被纳入边\n缘供肝的范畴。\n（二）边缘供肾标准。\n具有下列特征之一的属于边缘供肾：\n1.年龄＞60岁，或年龄50～60岁且符合以下情况中的2项：（1）捐献前血清肌\n酐（Scr）水平＞1.5mg/dL；（2）有高血压病史，死于高血压脑卒中；\n2.年龄≤3岁捐献肾脏，用于成人移植；\n3.BMI＞30kg/m2；\n4.高血压蛋白尿＞+；\n5.糖尿病肾病II期以内；\n6.捐献肾脏热缺血时间15～30分钟、冷缺血时间24小时以上。\n（三）边缘供心标准。\n具有下列特征之一的属于边缘供心：\n1.捐献者年龄大≥50岁；\n2.捐献心脏冷缺血时间＞6小时；\n3.器官捐献者与接受者体重比值＜0.8；\n4.器官捐献者与接受者血型相容但不一致；\n5.捐献者存在感染，但已经控制，血培养结果均为阴性，心脏直视检查无感染性心\n内膜炎；\n6.捐献心脏结构轻度异常，如左室壁轻度肥厚（＜14mm）、轻度瓣膜反流、易于矫\n治的先天性心脏病如卵圆孔未闭、冠脉动脉粥样硬化但无明显狭窄等；", "category": "人体器官获取组织质量控制指标", "type": "其他", "tables_html": [], "sub_indicators": [], "id": 777, "full_text": "移植器官术后功能延迟性恢复发生率（DGF 发生率）\n定义：同年度捐献器官移植术后DGF并发症发生比例，包括总DGF发生率、DBD\n来源器官DGF发生率、DCD来源器官DGF发生率、DBCD来源器官DGF发生率。\n计算公式：年度DGF病例数\n总DGF发生率（%）= ×100%\n同期移植病例总数\n年度（DBD/DCD/DBCD）DGF病例数\n（DBD/DCD/DBCD）DGF发生（%）= ×100%\n同期（DBD/DCD/DBCD）移植病例总数\n意义：反映OPO器官维护、质量评估能力。\n说明：边缘供器官定义及标准\n边缘供器官是指移植后存在较高原发性移植物无功能或功能低下以及迟发性移植物\n失活风险的捐献器官。\n（一）边缘供肝标准。\n具有下列特征之一的属于边缘供肝：\n1.年龄＞65岁的捐献者肝脏；\n2.供肝大泡性脂肪变＞30%或捐献者身体质量指数（BMI）＞30kg/m2；\n3.心脏死亡捐献者肝脏或脑心双死亡捐献者肝脏（功能性热缺血时间＞20分钟），\n或供肝冷缺血时间＞12小时；\n4.脑死亡供体中在重症监护病房所待时间＞7天，且获取时有多器官功能不全，血\n清总胆红素、血清转氨酶持续高于正常3倍以上；\n5.血流动力学的危险因素，包括：长期的低血压（舒张压＜60mmHg，＞2小时），\n应用多巴胺10μg/（kg•min），超过6小时以维持血压；或需要2种缩血管药物维持血压\n达6小时以上；\n6.血钠浓度始终高于155mmol/L。\n此外，ABO血型不相容供肝、劈裂式供肝以及血清病毒学阳性、不能解释病死原\n因、患有肝外恶性疾病、活动性的细菌感染、高风险的生活方式等捐献肝脏也被纳入边\n缘供肝的范畴。\n（二）边缘供肾标准。\n具有下列特征之一的属于边缘供肾：\n1.年龄＞60岁，或年龄50～60岁且符合以下情况中的2项：（1）捐献前血清肌\n酐（Scr）水平＞1.5mg/dL；（2）有高血压病史，死于高血压脑卒中；\n2.年龄≤3岁捐献肾脏，用于成人移植；\n3.BMI＞30kg/m2；\n4.高血压蛋白尿＞+；\n5.糖尿病肾病II期以内；\n6.捐献肾脏热缺血时间15～30分钟、冷缺血时间24小时以上。\n（三）边缘供心标准。\n具有下列特征之一的属于边缘供心：\n1.捐献者年龄大≥50岁；\n2.捐献心脏冷缺血时间＞6小时；\n3.器官捐献者与接受者体重比值＜0.8；\n4.器官捐献者与接受者血型相容但不一致；\n5.捐献者存在感染，但已经控制，血培养结果均为阴性，心脏直视检查无感染性心\n内膜炎；\n6.捐献心脏结构轻度异常，如左室壁轻度肥厚（＜14mm）、轻度瓣膜反流、易于矫\n治的先天性心脏病如卵圆孔未闭、冠脉动脉粥样硬化但无明显狭窄等；"}, {"name": "每千单位用血输血专业技术人员数", "code": "", "definition": "输血科（血库）专职专业技术人员数与医疗机构年度每千单位用血数之比。医\n疗机构年度用血总单位数指医疗机构一年时间使用全血、红细胞成分和血浆的总单位数。", "formula": "输血科（血库）专职专业技术人员数\n每千单位用血输血专业技术人员数=\n医疗机构年度用血总单位数/1000", "s function applyFilter(){
  let r=ALL;
  if(curType!=='all') r=r.filter(d=>d.type===curType);
  if(curCat) r=r.filter(d=>d.category===curCat);
  if(curKw){
    r=r.filter(d=>
      d.name.toLowerCase().includes(curKw)||
      d.category.toLowerCase().includes(curKw)||
      (d.definition&&d.definition.toLowerCase().includes(curKw))||
      (d.formula&&d.formula.toLowerCase().includes(curKw))||
      (d.significance&&d.significance.toLowerCase().includes(curKw))||
      (d.notes&&d.notes.toLowerCase().includes(curKw))||
      (d.full_text&&d.full_text.toLowerCase().includes(curKw))
    );
  }

  cnt.innerHTML='共 <strong>'+filtered.length+'</strong> 条'+(curKw?'（关键词：<em>'+esc(curKw)+'</em>）':'');

function renderList(reset){
  const wrap=document.getElementById('listWrap');
  if(reset) wrap.innerHTML='';
  const start=page*PAGE, end=Math.min(start+PAGE,filtered.length);
  const slice=filtered.slice(start,end);
  if(reset&&slice.length===0){
    wrap.innerHTML='<div class="empty"><div class="ei">🔍</div><p>没有找到符合条件的指标</p></div>';
    return;
  }
  const old=wrap.querySelector('.load-more');
  if(old) old.remove();
  slice.forEach(item=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=buildCard(item);
    card.addEventListener('click',()=>openModal(item));
    wrap.appendChild(card);
  });
  if(end<filtered.length){
    const more=document.createElement('div');
    more.className='load-more';
    more.innerHTML='<button class="more-btn" onclick="loadMore()">加载更多（还有'+(filtered.length-end)+'条）</button>';
    wrap.appendChild(more);
  }
}

  const hasSub=d.sub_indicators&&d.sub_indicators.length>0;
  return `
    <div class="card-name">${hl(esc(d.name),kw)}</div>
    <div class="card-meta">

function copyAll(){
  if(!curItem) return;
  const d=curItem;
  let t='【'+d.name+'】\n';
  t+='分类：'+d.category+'\n类型：'+d.type+'\n';
  if(d.code) t+='代码：'+d.code+'\n';
  if(d.definition) t+='\n定义：\n'+d.definition+'\n';
  if(d.formula) t+='\n计算公式：\n'+d.formula+'\n';
  if(d.significance) t+='\n指标意义：\n'+d.significance+'\n';
  if(d.notes) t+='\n说明：\n'+d.notes+'\n';
  if(d.sub_indicators&&d.sub_indicators.length>0){
    t+='\n子指标：\n';
    d.sub_indicators.forEach(sub=>{
      t+='  【'+sub.name+'】\n';
      if(sub.definition) t+='  定义：'+sub.definition+'\n';
      if(sub.formula) t+='  公式：'+sub.formula+'\n';
      if(sub.significance) t+='  意义：'+sub.significance+'\n';
    });
  }
  const write=text=>{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(showOk).catch(()=>fbCopy(text));
    }else fbCopy(text);
  };
  write(t);
}
function fbCopy(text){
  const ta=document.createElement('textarea');

  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');showOk();}catch(e){showToast('复制失败，请手动选择');}
  document.body.removeChild(ta);
}

// ===== 公式解析渲染器 =====
// 把 PDF 提取出的文本公式解析为数学分数形式的 HTML
// 典型格式：
//   "分子文本\n指标名= ×100%\n分母文本"
//   "分子\n名= ×\n分母\n100000"（万分比/十万分比）
function renderFormula(raw, boxClass) {
  if (!raw) return '';
  const lines = raw.split('\n').map(s => s.trim()).filter(s => s);

  // 判断某行是否是"公式等号行"（含 = 且含 × 或 x）
  function isEqLine(l) {
    return /=\s*[×x]/i.test(l);
  }

  const equations = [];
  let i = 0;

  while (i < lines.length) {
    // 找下一个公式等号行
    let eqIdx = -1;
    for (let k = i; k < lines.length; k++) {
      if (isEqLine(lines[k])) { eqIdx = k; break; }
    }

    if (eqIdx === -1) {
      // 没有等号行了，剩余作纯文本
      for (let j = i; j < lines.length; j++) {
        equations.push({ type: 'text', text: lines[j] });
      }
      break;
    }

    // 等号行前的行 = 分子（可能多行，去掉纯数字行）
    const numeratorLines = lines.slice(i, eqIdx).filter(l => !/^[\d,，.\s]+$/.test(l));

    // 等号行本身
    const eqLine = lines[eqIdx];

    // 等号行后，找下一个等号行，中间的行 = 分母（去纯数字）
    let nextEqIdx = -1;
    for (let k = eqIdx + 1; k < lines.length; k++) {
      if (isEqLine(lines[k])) { nextEqIdx = k; break; }
    }
    const denomEnd = nextEqIdx === -1 ? lines.length : nextEqIdx;
    const denominatorLines = lines.slice(eqIdx + 1, denomEnd).filter(l => !/^[\d,，.\s]+$/.test(l));

    // 解析等号行：提取左边（指标名称）+ 右边倍率
    // 格式示例：
    //   "剖宫产率= ×100%"
    //   "孕产妇死亡活产比= × 100000"
    //   "某率= ×"（倍率在下一行）
    const eqMatch = eqLine.match(/^(.*?)\s*=\s*[×x]\s*([\d,.]+%?‰?)?(.*)$/i);
    let lhs = eqLine;
    let rawMult = '';
    if (eqMatch) {
      lhs = (eqMatch[1] || '').trim();
      rawMult = ((eqMatch[2] || '') + (eqMatch[3] || '')).trim();
    }

    // 如果倍率在分母行里（如 "100000"）
    if (!rawMult && denominatorLines.length > 0) {
      const last = denominatorLines[denominatorLines.length - 1];
      if (/^(100|1000|10000|100000|1000000)%?$/.test(last.trim())) {
        rawMult = last.trim();
        denominatorLines.pop();
      }
    }

    // 格式化倍率显示
    if (!rawMult) rawMult = '100%';
    let multDisplay = rawMult;
    const mv = rawMult.replace('%','').replace('‰','');
    if (mv === '100' || rawMult === '100%')         multDisplay = '× 100%';
    else if (mv === '1000')                          multDisplay = '× 1000‰';
    else if (mv === '10000')                         multDisplay = '× 10000（万）';
    else if (mv === '100000')                        multDisplay = '× 100000（10万）';
    else if (mv === '1000000')                       multDisplay = '× 1000000（百万）';
    else if (rawMult.endsWith('%'))                  multDisplay = '× ' + rawMult;
    else                                             multDisplay = '× ' + rawMult;

    const num = numeratorLines.join('；') || '—';
    const den = denominatorLines.join('；') || '—';

    equations.push({ type: 'fraction', lhs, num, den, mult: multDisplay });
    i = denomEnd;
  }

  if (equations.length === 0) {
    return '<div class="' + boxClass + '"><div class="formula-raw">' + esc(raw) + '</div></div>';
  }

  let inner = '<div class="formula-equations">';
  for (const eq of equations) {
    if (eq.type === 'text') {
      inner += '<div class="formula-raw">' + esc(eq.text) + '</div>';
    } else {
      inner += '<div class="formula-eq">';
      if (eq.lhs) {
        inner += '<div class="formula-lhs">' + esc(eq.lhs) + '</div>';
        inner += '<span class="formula-eq-sign">=</span>';
      }
      inner += '<div class="formula-fraction">'
             + '<div class="formula-numerator">' + esc(eq.num) + '</div>'
             + '<div class="formula-line"></div>'
             + '<div class="formula-denominator">' + esc(eq.den) + '</div>'
             + '</div>';
      if (eq.mult) {
        inner += '<div class="formula-multiplier">' + esc(eq.mult) + '</div>';
      }
      inner += '</div>';
    }
  }
  inner += '</div>';
  return '<div class="' + boxClass + '">' + inner + '</div>';
}

</script>
</body>
</html>
