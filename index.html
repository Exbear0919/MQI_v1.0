<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a5ea8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>医疗质量指标检索系统</title>
<style>
/* ===== 重置 ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a5ea8;--primary-light:#2d7dd9;--primary-bg:#eaf1fb;
  --accent:#e8813a;--text:#1a1a2e;--text-sec:#5a6a7e;--text-light:#8899aa;
  --border:#dde3ec;--bg:#f4f7fc;--card:#ffffff;
  --shadow:0 2px 12px rgba(26,94,168,.10);--shadow-h:0 6px 24px rgba(26,94,168,.18);
  --radius:12px;--radius-sm:8px;--tr:.18s ease;
}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* 顶部 */
.top-bar{position:sticky;top:0;z-index:100;background:var(--primary);color:#fff;padding:12px 16px 10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.top-bar h1{font-size:clamp(15px,4vw,20px);font-weight:700;text-align:center;line-height:1.3}
.top-bar .sub{text-align:center;font-size:11px;opacity:.75;margin-top:2px}

/* 搜索 */
.search-wrap{background:var(--primary);padding:10px 16px 14px}
.search-box{display:flex;align-items:center;background:#fff;border-radius:50px;padding:0 14px;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:680px;margin:0 auto}
.si{color:var(--text-light);font-size:16px;flex-shrink:0}
.search-box input{flex:1;border:none;outline:none;font-size:clamp(14px,3.5vw,16px);padding:11px 0;color:var(--text);background:transparent;min-width:0}
.search-box input::placeholder{color:var(--text-light)}
.clr-btn{background:none;border:none;cursor:pointer;color:var(--text-light);font-size:18px;padding:4px;display:none;line-height:1}
.clr-btn.show{display:block}

/* Tab筛选 */
.filter-bar{background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 8px}
.filter-bar::-webkit-scrollbar{display:none}
.ftab{display:inline-block;padding:10px 14px;font-size:clamp(12px,3vw,14px);color:var(--text-sec);cursor:pointer;border-bottom:2px solid transparent;transition:color var(--tr),border-color var(--tr);user-select:none;-webkit-tap-highlight-color:transparent}
.ftab:hover{color:var(--primary)}
.ftab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* 分类下拉 */
.cat-wrap{background:#fff;border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:8px;max-width:900px;margin:0 auto}
.cat-label{font-size:13px;color:var(--text-sec);white-space:nowrap;flex-shrink:0}
.cat-sel{flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;font-size:clamp(12px,3vw,14px);color:var(--text);background:#fff;outline:none;cursor:pointer}
.cat-sel:focus{border-color:var(--primary)}

/* 统计栏 */
.stats-bar{padding:8px 16px;background:#fff;border-bottom:1px solid var(--border)}
.stats-inner{max-width:900px;margin:0 auto;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stat-item{font-size:12px;color:var(--text-sec)}
.stat-item strong{color:var(--primary)}

/* 结果 */
.result-bar{padding:10px 16px 6px;max-width:900px;margin:0 auto}
.result-count{font-size:13px;color:var(--text-sec)}
.result-count strong{color:var(--primary);font-weight:700}

/* 列表 */
.list-wrap{padding:0 12px 20px;max-width:900px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow var(--tr),transform var(--tr);-webkit-tap-highlight-color:transparent;border:1px solid transparent}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px);border-color:var(--primary-bg)}
.card:active{transform:scale(.99)}
.card-name{font-size:clamp(14px,3.5vw,16px);font-weight:600;color:var(--text);line-height:1.5;margin-bottom:6px}
.card-name mark,.card-def mark{background:#fff3b0;color:var(--text);border-radius:3px;padding:0 1px}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:50px;font-weight:500}
.tag-spec{background:var(--primary-bg);color:var(--primary)}
.tag-other{background:#f0f4f0;color:#4a7a4a}
.tag-tech{background:#fef3e8;color:#c06010}
.tag-sub{background:#f5f0ff;color:#6644bb;font-size:10px}
.card-cat{font-size:12px;color:var(--text-light);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-def{font-size:12px;color:var(--text-sec);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;line-height:1.6}
.load-more{text-align:center;padding:16px}
.more-btn{background:var(--primary);color:#fff;border:none;border-radius:50px;padding:12px 40px;font-size:14px;cursor:pointer;box-shadow:var(--shadow);transition:background var(--tr),transform var(--tr)}
.more-btn:hover{background:var(--primary-light);transform:translateY(-1px)}
.empty{text-align:center;padding:60px 20px;color:var(--text-light)}
.empty .ei{font-size:48px;margin-bottom:16px}
.empty p{font-size:15px}

/* 模态框 */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:800px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slideUp .25s ease;position:relative}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.drag-bar{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0}
.modal-hd{padding:14px 60px 14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:1}
.modal-title{font-size:clamp(15px,3.5vw,18px);font-weight:700;color:var(--text);line-height:1.5}
.modal-code{font-size:11px;color:var(--text-light);margin-top:3px;font-family:monospace}
.m-close{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:var(--bg);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text-sec);margin-top:4px}
.m-close:hover{background:var(--border)}
.modal-bd{padding:16px 20px 8px}
.m-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}

/* 详情节 */
.sec{margin-bottom:18px}
.sec-label{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--primary);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sec-label::before{content:'';display:inline-block;width:3px;height:14px;background:var(--primary);border-radius:2px}
.sec-content{font-size:clamp(13px,3vw,15px);line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-all}

/* 子指标 */
.sub-section{background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;border-left:3px solid #a090ee}
.sub-title{font-size:14px;font-weight:600;color:#6644bb;margin-bottom:8px}
.sub-def,.sub-sig,.sub-notes{font-size:clamp(12px,2.8vw,14px);line-height:1.7;color:var(--text);margin-bottom:6px;white-space:pre-wrap;word-break:break-all}
.sub-label{font-size:11px;font-weight:700;color:#6644bb;margin-bottom:3px}

/* ===== 数学公式分数展示 ===== */
/* 主指标公式框 */
.formula-visual{
  background:linear-gradient(135deg,#f0f6ff 0%,#eaf1fb 100%);
  border:1px solid #c5d8f5;
  border-radius:var(--radius-sm);
  padding:20px 16px 18px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
/* 子指标公式框 */
.sub-formula-visual{
  background:linear-gradient(135deg,#f8f5ff 0%,#f0eeff 100%);
  border:1px solid #c8c0ee;
  border-radius:6px;
  padding:16px 12px 14px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  margin-bottom:6px;
}
/* 多公式竖排 */
.formula-equations{display:flex;flex-direction:column;gap:22px}
/* 单条公式行：名称 = 分数 × 倍率 */
.formula-eq{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  min-width:0;
}
/* 左侧指标名称标签 */
.formula-lhs{
  font-size:clamp(12px,2.8vw,13px);
  color:var(--primary);
  font-weight:700;
  white-space:nowrap;
  background:rgba(26,94,168,.08);
  padding:4px 10px;
  border-radius:6px;
  border:1px solid rgba(26,94,168,.2);
  line-height:1.4;
  max-width:200px;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sub-formula-visual .formula-lhs{
  color:#6644bb;
  background:rgba(102,68,187,.08);
  border-color:rgba(102,68,187,.2);
}
/* 等号 */
.formula-eq-sign{
  font-size:clamp(18px,3.5vw,22px);
  color:var(--text-sec);
  font-weight:300;
  line-height:1;
  flex-shrink:0;
}
/* 分数容器 */
.formula-fraction{
  display:inline-flex;
  flex-direction:column;
  align-items:stretch;
  min-width:140px;
  max-width:calc(100vw - 200px);
}
/* 分子 */
.formula-numerator{
  font-size:clamp(11px,2.6vw,13px);
  color:var(--text);
  text-align:center;
  padding:7px 14px 6px;
  line-height:1.5;
  word-break:break-all;
  background:rgba(255,255,255,.8);
  border-radius:4px 4px 0 0;
  border:1px solid rgba(26,94,168,.12);
  border-bottom:none;
}
/* 分数横线 */
.formula-line{
  height:2px;
  background:var(--text);
  border-radius:1px;
  margin:0;
}
/* 分母 */
.formula-denominator{
  font-size:clamp(11px,2.6vw,13px);
  color:var(--text);
  text-align:center;
  padding:6px 14px 7px;
  line-height:1.5;
  word-break:break-all;
  background:rgba(255,255,255,.8);
  border-radius:0 0 4px 4px;
  border:1px solid rgba(26,94,168,.12);
  border-top:none;
}
/* 乘以倍率 */
.formula-multiplier{
  font-size:clamp(13px,2.8vw,15px);
  color:#c05000;
  font-weight:700;
  white-space:nowrap;
  flex-shrink:0;
  background:#fff3e8;
  padding:5px 10px;
  border-radius:6px;
  border:1px solid #f5c89a;
  line-height:1.4;
}
.sub-formula-visual .formula-multiplier{
  color:#7722aa;
  background:#f5eeff;
  border-color:#d4b8ee;
}
/* 兜底纯文本行 */
.formula-raw{
  background:rgba(255,255,255,.6);
  border:1px solid rgba(26,94,168,.12);
  border-radius:var(--radius-sm);
  padding:8px 12px;
  font-family:"Courier New",Consolas,monospace;
  font-size:clamp(11px,2.5vw,13px);
  white-space:pre-wrap;
  word-break:break-all;
  color:var(--text);
}

/* 表格 */
.indicator-table{width:100%;border-collapse:collapse;font-size:clamp(11px,2.5vw,13px);margin:8px 0;overflow-x:auto;display:block}
.indicator-table th,.indicator-table td{border:1px solid var(--border);padding:6px 8px;text-align:left;line-height:1.5}
.indicator-table th{background:var(--primary-bg);color:var(--primary);font-weight:600}
.indicator-table tr:nth-child(even){background:#f8fafd}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0}

/* 底部操作 */
.modal-ft{display:flex;gap:10px;padding:12px 20px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card)}
.act-btn{flex:1;padding:12px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all var(--tr);-webkit-tap-highlight-color:transparent}
.act-copy{background:var(--primary-bg);color:var(--primary)}
.act-copy:hover{background:#d0e4f8}
.act-copy.ok{background:#d4f0d4;color:#2d7a2d}
/* 图片复制按钮 */
.act-img{background:#fff4e8;color:#d97706;border:1.5px solid #fcd34d}
.act-img:hover{background:#fef3c7}
.act-img.ok{background:#d1fae5;color:#065f46}


.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:50px;font-size:14px;z-index:999;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 桌面端 */

/* ===== 手机端搜索框强制填满 ===== */
@media(max-width:767px){
  .search-wrap{
    padding:10px 14px 14px !important;
    overflow:hidden;
  }
  .search-box{
    width:100% !important;
    max-width:100% !important;
    border-radius:28px !important;
    padding:0 14px !important;
    gap:6px;
    margin:0 !important;
  }
  .search-box input{
    font-size:15px !important;
    padding:10px 0;
  }
  .si{font-size:15px !important}
  .clr-btn{font-size:16px !important;padding:2px 6px !important}
  /* 筛选Tab在手机上可横向滑动，文字更短 */
  .ftab{
    padding:9px 10px;
    font-size:12px;
  }
  .filter-bar{
    padding:0 8px;
    /* 保持滚动，但确保第一个Tab靠左 */
    justify-content:flex-start;
    display:flex;
  }
}
@media(min-width:768px){
  .filter-bar{display:flex;justify-content:center;padding:0 20px}
  .ftab{padding:12px 18px}
  .cat-wrap,.result-bar,.list-wrap,.stats-bar .stats-inner{max-width:900px}
  .overlay{align-items:center;padding:20px}
  .modal{border-radius:var(--radius);max-height:88vh}
  .drag-bar{display:none}
}
@media(min-width:1200px){
  .search-box{max-width:780px}
  .list-wrap,.result-bar,.cat-wrap{max-width:1000px}
  .modal{max-width:900px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

<div class="top-bar">
  <h1>🏥 医疗质量指标检索系统</h1>
  <div class="sub">共 833 条指标 · 48 个专业方向 · 离线可用</div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <span class="si">🔍</span>
    <input type="search" id="kw" placeholder="搜索指标名称、定义、关键词…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="clr-btn" id="clrBtn" onclick="clearKw()">✕</button>
  </div>
</div>

<div class="filter-bar" id="filterBar"></div>

<div style="background:#fff;border-bottom:1px solid var(--border)">
  <div class="cat-wrap">
    <span class="cat-label">专业方向：</span>
    <select class="cat-sel" id="catSel">
      <option value="">全部分类</option>
    </select>
  </div>
</div>

<div class="stats-bar">
  <div class="stats-inner">
    <div class="stat-item">专科类 <strong>623</strong></div>
    <div class="stat-item">技术类 <strong>145</strong></div>
    <div class="stat-item">其他 <strong>65</strong></div>
    <div class="stat-item" id="resultCount" style="margin-left:auto">加载中…</div>
  </div>
</div>

<div class="list-wrap" id="listWrap"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="drag-bar"></div>
    <div class="modal-hd">
      <div class="modal-title" id="mTitle"></div>
      <div class="modal-code" id="mCode"></div>
      <button class="m-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-bd" id="mBody"></div>
    <div class="modal-ft">
      <button class="act-btn act-copy" id="copyBtn" onclick="copyAll()">📋 复制文字</button>
      <button class="act-btn act-img" id="imgBtn" onclick="copyImage()">🖼 复制图片</button>
    </div>
  </div>
</div>

<script>

I评分≤90分\n的患者。"}, {"name": "\u0007CAP患者住院期间抗感染治疗前病原学送检比例", "code": "RES-CAP-03", "definition": "单位时间内，抗感染治疗前行病原学送检的住院CAP患者数占同期住院\nCAP患者总数的比例。", "formula": "CAP患者住院期间抗感染 抗感染治疗前行病原学送检的住院CAP患者数\n= ×100%\n治疗前病原学送检比例 同期住院CAP患者总数", "significance": "反映医疗机构对CAP诊疗的规范性。", "notes": "病原学检查包括下列检查之一：痰/肺泡灌洗液/胸腔积液涂片、培养，鼻/\n咽拭子病毒检测，非典型病原体检测，血培养。", "category": "呼吸内科专业医疗质量控制指标（2019年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 38, "full_text": "\u0007CAP患者住院期间抗感染治疗前病原学送检比例\n定义：单位时间内，抗感染治疗前行病原学送检的住院CAP患者数占同期住院\nCAP患者总数的比例。\n计算公式：CAP患者住院期间抗感染 抗感染治疗前行病原学送检的住院CAP患者数\n= ×100%\n治疗前病原学送检比例 同期住院CAP患者总数\n意义：反映医疗机构对CAP诊疗的规范性。\n说明：病原学检查包括下列检查之一：痰/肺泡灌洗液/胸腔积液涂片、培养，鼻/\n咽拭子病毒检测，非典型病原体检测，血培养。"}, {"name": "CAP患者住院死亡率", "code": "RES-CAP-04", "definition": "单位时间内，住院CAP患者死亡人数与同期住院CAP患者总数的比值。", "formula": "住院CAP患者死亡人数\nCAP患者住院死亡率= ×100%\n同期住院CAP患者总数", "significance": "", "notes": "", "category": "呼吸内科专业医疗质量控制指标（2019年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 39, "full_text": "CAP患者住院死亡率\n定义：单位时间内，住院CAP患者死亡人数与同期住院CAP患者总数的比值。\n计算公式：住院CAP患者死亡人数\nCAP患者住院死亡率= ×100%\n同期住院CAP患者总数"}, {"name": "住院CAP患者接受机械通气的比例", "code": "RES-CAP-05", "definition": "单位时间内，住院期间接受机械通气（包括无创/有创机械通气）的CAP患\n者数与住院CAP患者总数的比值。", "formula": "住院期间接受机械通气的CAP患者数\n住院CAP患者接受机械通气的比例= ×100%\n同期住院CAP患者总数", "significance": "机械通气是CAP患者合并呼吸衰竭时重要的治疗手段，该指标有助于评价收\n治患者的严重程度及相应治疗的规范性。\n神经系统疾病\n医疗质量控制指标（2020 年版）", "notes": "", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 40, "full_text": "住院CAP患者接受机械通气的比例\n定义：单位时间内，住院期间接受机械通气（包括无创/有创机械通气）的CAP患\n者数与住院CAP患者总数的比值。\n计算公式：住院期间接受机械通气的CAP患者数\n住院CAP患者接受机械通气的比例= ×100%\n同期住院CAP患者总数\n意义：机械通气是CAP患者合并呼吸衰竭时重要的治疗手段，该指标有助于评价收\n治患者的严重程度及相应治疗的规范性。\n神经系统疾病\n医疗质量控制指标（2020 年版）"}, {"name": "癫痫发作频率记录率", "code": "NEU-EPI-01", "definition": "单位时间内，住院癫痫患者中各种发作类型的发作频率均得到记录的人数占\n同期住院癫痫患者总数的比例。", "formula": "各种发作类型的发作频率均得到记录的住院癫痫患者数\n癫痫发作频率记录率= ×100%\n同期住院癫痫患者总数", "significance": "治疗癫痫的主要目标是减少发作频率。准确记录各种发作类型的发作频率是\n抗癫痫治疗的依据和基础，也与健康相关生活质量的改善密切相关，是反映癫痫治疗效\n果的重要过程指标之一。", "notes": "（1）癫痫指至少2次间隔>24小时的非诱发性（或反射性）痫性发作，或确\n诊某种癫痫综合征。参考国际抗癫痫联盟（ILAE）发布的《ILAE官方报告：癫痫实用\n定义》。\n（2）癫痫的发作分类包括：局灶性发作、全面性发作、不明起始部位发作、未能分\n类发作。参考ILAE发布的《癫痫发作类型的操作分类：国际抗癫痫联盟意见书》。", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 41, "full_text": "癫痫发作频率记录率\n定义：单位时间内，住院癫痫患者中各种发作类型的发作频率均得到记录的人数占\n同期住院癫痫患者总数的比例。\n计算公式：各种发作类型的发作频率均得到记录的住院癫痫患者数\n癫痫发作频率记录率= ×100%\n同期住院癫痫患者总数\n意义：治疗癫痫的主要目标是减少发作频率。准确记录各种发作类型的发作频率是\n抗癫痫治疗的依据和基础，也与健康相关生活质量的改善密切相关，是反映癫痫治疗效\n果的重要过程指标之一。\n说明：（1）癫痫指至少2次间隔>24小时的非诱发性（或反射性）痫性发作，或确\n诊某种癫痫综合征。参考国际抗癫痫联盟（ILAE）发布的《ILAE官方报告：癫痫实用\n定义》。\n（2）癫痫的发作分类包括：局灶性发作、全面性发作、不明起始部位发作、未能分\n类发作。参考ILAE发布的《癫痫发作类型的操作分类：国际抗癫痫联盟意见书》。"}, {"name": "抗癫痫药物规范服用率", "code": "NEU-EPI-02", "definition": "单位时间内，住院癫痫患者（确诊 3 月及以上）中近 3 月按照癫痫诊断类\n型规范使用抗癫痫药物治疗的人数占同期住院癫痫患者（确诊 3 月及以上）人数的\n比例。", "formula": "近3月规范使用抗癫痫药物治疗的住院\n癫痫患者（确诊3月及以上）数\n抗癫痫药物规范服用率= ×100%\n同期住院癫痫患者\n（确诊3月及以上）总数", "significance": "减少癫痫发作频率与患者生活质量密切相关，对于每一例确诊的患者，均应\n采用抗癫痫药物控制癫痫发作。反映医疗机构使用抗癫痫药物规范性。", "notes": "规范使用抗癫痫药物指患者依照发作类型服用恰当的抗癫痫药物，按照规范\n剂量，规律服用抗癫痫药物3月及以上。参考中国成人癫痫患者长程管理共识专家协作\n组发布《关于成人癫痫患者长程管理的专家共识》。", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 42, "full_text": "抗癫痫药物规范服用率\n定义：单位时间内，住院癫痫患者（确诊 3 月及以上）中近 3 月按照癫痫诊断类\n型规范使用抗癫痫药物治疗的人数占同期住院癫痫患者（确诊 3 月及以上）人数的\n比例。\n计算公式：近3月规范使用抗癫痫药物治疗的住院\n癫痫患者（确诊3月及以上）数\n抗癫痫药物规范服用率= ×100%\n同期住院癫痫患者\n（确诊3月及以上）总数\n意义：减少癫痫发作频率与患者生活质量密切相关，对于每一例确诊的患者，均应\n采用抗癫痫药物控制癫痫发作。反映医疗机构使用抗癫痫药物规范性。\n说明：规范使用抗癫痫药物指患者依照发作类型服用恰当的抗癫痫药物，按照规范\n剂量，规律服用抗癫痫药物3月及以上。参考中国成人癫痫患者长程管理共识专家协作\n组发布《关于成人癫痫患者长程管理的专家共识》。"}, {"name": "抗癫痫药物严重不良反应发生率\u0007", "code": "NEU-EPI-03", "definition": "单位时间内，住院癫痫患者病程中发生抗癫痫药物严重不良反应的人次数与\n同期住院癫痫患者总人次数的比值。", "formula": "病程中发生抗癫痫药物严重不良\n抗癫痫药物严重不良反应发生率= 反应的住院癫痫患者人次数 ×100%\n同期住院癫痫患者总人次数", "significance": "反映医疗机构合理使用抗癫痫药物的合理性。", "notes": "抗癫痫药物严重不良反应指：使用抗癫痫药物后导致患者需前往门诊就诊，\n并减药、停药或对症处理；或导致患者需要住院治疗；或住院时间延长；或导致胎儿先\n天性畸形或出生缺陷。", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 43, "full_text": "抗癫痫药物严重不良反应发生率\u0007\n定义：单位时间内，住院癫痫患者病程中发生抗癫痫药物严重不良反应的人次数与\n同期住院癫痫患者总人次数的比值。\n计算公式：病程中发生抗癫痫药物严重不良\n抗癫痫药物严重不良反应发生率= 反应的住院癫痫患者人次数 ×100%\n同期住院癫痫患者总人次数\n意义：反映医疗机构合理使用抗癫痫药物的合理性。\n说明：抗癫痫药物严重不良反应指：使用抗癫痫药物后导致患者需前往门诊就诊，\n并减药、停药或对症处理；或导致患者需要住院治疗；或住院时间延长；或导致胎儿先\n天性畸形或出生缺陷。"}, {"name": "癫痫患者病因学检查完成率", "code": "NEU-EPI-04", "definition": "单位时间内，住院癫痫患者完成神经影像学检查（如头颅CT或核磁共振）\n及脑电图学相关检查（普通或视频长程脑电图）的人数占同期住院癫痫患者总数的比例。", "formula": "癫痫患者病因 完成神经影像学及脑电图学相关检查的住院癫痫患者数\n= ×100%\n学检查完成率 同期住院癫痫患者总数", "significance": "神经电生理及神经影像学是重要的明确癫痫病因的手段，其完成率反映医疗\n机构癫痫医疗质量。", "notes": "神经影像学检查指头部CT或核磁共振检查，脑电图学相关检查包括常规头\n皮脑电图监测或长程视频脑电图监测。癫痫患者病因学检查应完成神经影像学检查及脑\n电图学相关检查。", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 44, "full_text": "癫痫患者病因学检查完成率\n定义：单位时间内，住院癫痫患者完成神经影像学检查（如头颅CT或核磁共振）\n及脑电图学相关检查（普通或视频长程脑电图）的人数占同期住院癫痫患者总数的比例。\n计算公式：癫痫患者病因 完成神经影像学及脑电图学相关检查的住院癫痫患者数\n= ×100%\n学检查完成率 同期住院癫痫患者总数\n意义：神经电生理及神经影像学是重要的明确癫痫病因的手段，其完成率反映医疗\n机构癫痫医疗质量。\n说明：神经影像学检查指头部CT或核磁共振检查，脑电图学相关检查包括常规头\n皮脑电图监测或长程视频脑电图监测。癫痫患者病因学检查应完成神经影像学检查及脑\n电图学相关检查。"}, {"name": "癫痫患者精神行为共患病筛查率\u0007\u0007", "code": "NEU-EPI-05", "definition": "单位时间内，住院癫痫患者完成共患病（抑郁症、焦虑症）筛查人数占同期\n住院癫痫患者总数的比例。", "formula": "进行精神行为共患病筛查的住院癫痫患者数\n癫痫患者精神行为共患病筛查率= ×100%\n同期住院癫痫患者总数", "significance": "精神和行为障碍是所有癫痫患者及家庭的一个重要担忧和负担，其带来的社\n会负担及负面影响远远大于患者本身的发作情况。该指标体现医疗机构对癫痫患者抑郁\n症及焦虑症为主的精神疾病共病筛查情况。", "notes": "癫痫患者精神行为共患病焦虑症、抑郁症筛查应使用经验证的中文版筛查\n量表。", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 45, "full_text": "癫痫患者精神行为共患病筛查率\u0007\u0007\n定义：单位时间内，住院癫痫患者完成共患病（抑郁症、焦虑症）筛查人数占同期\n住院癫痫患者总数的比例。\n计算公式：进行精神行为共患病筛查的住院癫痫患者数\n癫痫患者精神行为共患病筛查率= ×100%\n同期住院癫痫患者总数\n意义：精神和行为障碍是所有癫痫患者及家庭的一个重要担忧和负担，其带来的社\n会负担及负面影响远远大于患者本身的发作情况。该指标体现医疗机构对癫痫患者抑郁\n症及焦虑症为主的精神疾病共病筛查情况。\n说明：癫痫患者精神行为共患病焦虑症、抑郁症筛查应使用经验证的中文版筛查\n量表。"}, {"name": "育龄期女性癫痫患者妊娠宣教执行率", "code": "NEU-EPI-06", "definition": "单位时间内，住院育龄期（18～44岁，月经周期正常）女性癫痫患者（或\n照料者）在一年内至少接受过1次关于癫痫及治疗如何影响避孕或妊娠咨询者占同期育\n龄期女性住院癫痫患者的比例。", "formula": "每年至少接受过1次关于癫痫及其治疗如何影响避孕或妊\n育龄期女性癫痫患者 娠的咨询的育龄期女性住院癫痫患者（或其照料者）数\n= ×100%\n妊娠宣教执行率 同期住院育龄期女性\n癫痫患者总数", "significance": "癫痫与生育能力下降、妊娠风险增加以及新生儿畸形风险相关，该指标体现\n对育龄期女性癫痫患者的治疗方案计划性和管理水平。", "notes": "育龄期女性癫痫患者指确诊癫痫，且具有生育可能的女性（18～44岁）患\n者。育龄期女性患者（或其照料者）应每年至少接收一次关于癫痫及其治疗对避孕、妊\n娠可能的影响的咨询：包括生殖内分泌情况的评估或相应的药物调整；避孕教育；围孕\n期叶酸增补知识普及；孕期癫痫及抗癫痫药物潜在风险讨论；妊娠安全教育；哺乳知识\n普及；针对妊娠需求进行药物评估或调整及其他相关问题。", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 46, "full_text": "育龄期女性癫痫患者妊娠宣教执行率\n定义：单位时间内，住院育龄期（18～44岁，月经周期正常）女性癫痫患者（或\n照料者）在一年内至少接受过1次关于癫痫及治疗如何影响避孕或妊娠咨询者占同期育\n龄期女性住院癫痫患者的比例。\n计算公式：每年至少接受过1次关于癫痫及其治疗如何影响避孕或妊\n育龄期女性癫痫患者 娠的咨询的育龄期女性住院癫痫患者（或其照料者）数\n= ×100%\n妊娠宣教执行率 同期住院育龄期女性\n癫痫患者总数\n意义：癫痫与生育能力下降、妊娠风险增加以及新生儿畸形风险相关，该指标体现\n对育龄期女性癫痫患者的治疗方案计划性和管理水平。\n说明：育龄期女性癫痫患者指确诊癫痫，且具有生育可能的女性（18～44岁）患\n者。育龄期女性患者（或其照料者）应每年至少接收一次关于癫痫及其治疗对避孕、妊\n娠可能的影响的咨询：包括生殖内分泌情况的评估或相应的药物调整；避孕教育；围孕\n期叶酸增补知识普及；孕期癫痫及抗癫痫药物潜在风险讨论；妊娠安全教育；哺乳知识\n普及；针对妊娠需求进行药物评估或调整及其他相关问题。"}, {"name": "癫痫患者择期手术在院死亡率", "code": "NEU-EPI-07", "definition": "单位时间内，所有住院行癫痫择期手术的癫痫患者术后在院死亡率。", "formula": "行癫痫择期手术后在院死亡患者数\n癫痫患者择期手术在院死亡率= ×100％\n同期住院行癫痫择期手术的患者总数", "significance": "是反映医疗机构癫痫外科医疗质量的终点指标，体现了医疗机构癫痫外科的\n综合质量。", "notes": "对两种及以上足量抗癫痫药物规范治疗失败的癫痫患者，应进行癫痫手术评估。\n癫痫手术评估检测包括：头皮脑电图检测、发作期视频脑电图检测、头部核磁共振、头部\nPET/CT或PET/MRI及头部功能影像检测。对上述各项检测均提示一致的致痫灶，应行择期\n手术。", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 47, "full_text": "癫痫患者择期手术在院死亡率\n定义：单位时间内，所有住院行癫痫择期手术的癫痫患者术后在院死亡率。\n计算公式：行癫痫择期手术后在院死亡患者数\n癫痫患者择期手术在院死亡率= ×100％\n同期住院行癫痫择期手术的患者总数\n意义：是反映医疗机构癫痫外科医疗质量的终点指标，体现了医疗机构癫痫外科的\n综合质量。\n说明：对两种及以上足量抗癫痫药物规范治疗失败的癫痫患者，应进行癫痫手术评估。\n癫痫手术评估检测包括：头皮脑电图检测、发作期视频脑电图检测、头部核磁共振、头部\nPET/CT或PET/MRI及头部功能影像检测。对上述各项检测均提示一致的致痫灶，应行择期\n手术。"}, {"name": "癫痫患者术后并发症发生率", "code": "NEU-EPI-08", "definition": "单位时间内，所有住院行癫痫手术的癫痫患者术后并发症发生率。", "formula": "行癫痫手术后在院并发症发生人数\n癫痫患者术后并发症发生率= ×100％\n同期住院行癫痫手术的患者总数", "significance": "反映医疗机构癫痫外科手术术后并发症情况。控制术后并发症的发生有利于\n患者早期恢复和长期预后。", "notes": "癫痫手术的术后并发症包括：脑脊液漏、脑积水、颅内/颅外感染（浅表或深\n部）、颅内或硬膜外脓肿、缺血性脑血管病、颅内血肿、静脉窦血栓形成、深静脉血栓形\n成、肺栓塞、肺部感染、代谢紊乱、语言障碍、记忆障碍、偏瘫、精神障碍、视野缺损。", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 48, "full_text": "癫痫患者术后并发症发生率\n定义：单位时间内，所有住院行癫痫手术的癫痫患者术后并发症发生率。\n计算公式：行癫痫手术后在院并发症发生人数\n癫痫患者术后并发症发生率= ×100％\n同期住院行癫痫手术的患者总数\n意义：反映医疗机构癫痫外科手术术后并发症情况。控制术后并发症的发生有利于\n患者早期恢复和长期预后。\n说明：癫痫手术的术后并发症包括：脑脊液漏、脑积水、颅内/颅外感染（浅表或深\n部）、颅内或硬膜外脓肿、缺血性脑血管病、颅内血肿、静脉窦血栓形成、深静脉血栓形\n成、肺栓塞、肺部感染、代谢紊乱、语言障碍、记忆障碍、偏瘫、精神障碍、视野缺损。"}, {"name": "癫痫患者术后病理明确率", "code": "NEU-EPI-09", "definition": "单位时间内，所有住院行癫痫病灶切除手术的癫痫患者术后病理结果明确率。", "formula": "行癫痫手术后病理明确患者数\n癫痫患者术后病理明确率= ×100％\n同期住院行癫痫手术的患者总数", "significance": "反映医疗机构癫痫外科手术术后病理诊断明确情况。患者病理结果是后续治\n疗和预后的基石，明确病理结果，有助于患者长期治疗、随访及教育。", "notes": "癫痫术后病理明确指规范确切的临床病理诊断，包括明确癫痫患者切除病灶\n的病理诊断为：皮质发育畸形、局灶性皮质发育不良、结节性硬化、海马硬化、灰质异\n位、肿瘤、软化灶、胶质瘢痕、炎症、血管畸形、感染性病变、非特异性改变等。", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 49, "full_text": "癫痫患者术后病理明确率\n定义：单位时间内，所有住院行癫痫病灶切除手术的癫痫患者术后病理结果明确率。\n计算公式：行癫痫手术后病理明确患者数\n癫痫患者术后病理明确率= ×100％\n同期住院行癫痫手术的患者总数\n意义：反映医疗机构癫痫外科手术术后病理诊断明确情况。患者病理结果是后续治\n疗和预后的基石，明确病理结果，有助于患者长期治疗、随访及教育。\n说明：癫痫术后病理明确指规范确切的临床病理诊断，包括明确癫痫患者切除病灶\n的病理诊断为：皮质发育畸形、局灶性皮质发育不良、结节性硬化、海马硬化、灰质异\n位、肿瘤、软化灶、胶质瘢痕、炎症、血管畸形、感染性病变、非特异性改变等。"}, {"name": "癫痫手术患者出院时继续抗癫痫药物治疗率", "code": "NEU-EPI-10", "definition": "单位时间内，所有住院行手术治疗的癫痫患者出院时继续抗癫痫药物治疗率。", "formula": "癫痫手术患者出院时 出院时继续抗癫痫药物治疗的癫痫手术患者数\n= ×100％\n继续抗癫痫药物治疗率 同期住院行癫痫手术的患者总数", "significance": "反映医疗机构癫痫外科手术术后序贯治疗情况。完成癫痫手术治疗后，患者\n应该在专科医师指导下继续抗癫痫药物治疗以达到更优的癫痫发作控制。", "notes": "癫痫手术患者出院时应按照既往药物治疗方案，规范服用抗癫痫药物。", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 50, "full_text": "癫痫手术患者出院时继续抗癫痫药物治疗率\n定义：单位时间内，所有住院行手术治疗的癫痫患者出院时继续抗癫痫药物治疗率。\n计算公式：癫痫手术患者出院时 出院时继续抗癫痫药物治疗的癫痫手术患者数\n= ×100％\n继续抗癫痫药物治疗率 同期住院行癫痫手术的患者总数\n意义：反映医疗机构癫痫外科手术术后序贯治疗情况。完成癫痫手术治疗后，患者\n应该在专科医师指导下继续抗癫痫药物治疗以达到更优的癫痫发作控制。\n说明：癫痫手术患者出院时应按照既往药物治疗方案，规范服用抗癫痫药物。"}, {"name": "惊厥性癫痫持续状态发作控制率", "code": "NEU-EPI-11", "definition": "单位时间内，惊厥性癫痫持续状态患者中发作在接诊后1小时内得到控制的\n人数占同期住院惊厥性癫痫持续状态患者总数的比例。", "formula": "惊厥性癫痫持续 发作在接诊后1小时内得到控制的惊厥性癫痫持续状态患者数\n= ×100％\n状态发作控制率 同期住院惊厥性癫痫持续状态患者总数", "significance": "惊厥性癫痫持续状态治疗的主要目标是尽快控制痫性发作，减少神经损伤，\n与患者预后密切相关。", "notes": "（1）惊厥性癫痫持续状态是指，每次全身性强直-阵挛（GTC）发作持续\n5分钟以上；或2次以上，发作间期意识未能完全恢复。\n（2）惊厥性癫痫持续状态在接诊后经观察期、第一阶段、第二阶段和第三阶段治疗\n后按照标准流程已经到60分钟的时间点，已经使用了第三阶段治疗仍无法控制发作时为\n超级难治性惊厥性癫痫持续状态。因此，采用接诊后1小时（60分钟）作为评估癫痫持\n续状态发作控制率的时间点。治疗阶段流程图参考《成人全面性惊厥性癫痫持续状态治\n疗中国专家共识》。", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 51, "full_text": "惊厥性癫痫持续状态发作控制率\n定义：单位时间内，惊厥性癫痫持续状态患者中发作在接诊后1小时内得到控制的\n人数占同期住院惊厥性癫痫持续状态患者总数的比例。\n计算公式：惊厥性癫痫持续 发作在接诊后1小时内得到控制的惊厥性癫痫持续状态患者数\n= ×100％\n状态发作控制率 同期住院惊厥性癫痫持续状态患者总数\n意义：惊厥性癫痫持续状态治疗的主要目标是尽快控制痫性发作，减少神经损伤，\n与患者预后密切相关。\n说明：（1）惊厥性癫痫持续状态是指，每次全身性强直-阵挛（GTC）发作持续\n5分钟以上；或2次以上，发作间期意识未能完全恢复。\n（2）惊厥性癫痫持续状态在接诊后经观察期、第一阶段、第二阶段和第三阶段治疗\n后按照标准流程已经到60分钟的时间点，已经使用了第三阶段治疗仍无法控制发作时为\n超级难治性惊厥性癫痫持续状态。因此，采用接诊后1小时（60分钟）作为评估癫痫持\n续状态发作控制率的时间点。治疗阶段流程图参考《成人全面性惊厥性癫痫持续状态治\n疗中国专家共识》。"}, {"name": "惊厥性癫痫持续状态初始治疗标准方案应用率", "code": "NEU-EPI-12", "definition": "单位时间内，住院惊厥性癫痫持续状态患者中应用指南推荐的初始治疗标准\n方案治疗的患者数占同期住院惊厥性癫痫持续状态患者总数的比例。", "formula": "应用标准初始治疗方案治疗的\n惊厥性癫痫持续状态初始 住院惊厥性癫痫持续状态患者数\n= ×100％\n治疗标准方案应用率 同期住院惊厥性癫痫\n持续状态患者总数", "significance": "使用惊厥性癫痫持续状态治疗的初始治疗标准方案尽快控制发作，减少神经\n损伤，与患者预后密切相关。", "notes": "初始治疗方案参考《成人全面性惊厥性癫痫持续状态治疗中国专家共识》。", "category": "神经系统疾病医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 52, "full_text": "惊厥性癫痫持续状态初始治疗标准方案应用率\n定义：单位时间内，住院惊厥性癫痫持续状态患者中应用指南推荐的初始治疗标准\n方案治疗的患者数占同期住院惊厥性癫痫持续状态患者总数的比例。\n计算公式：应用标准初始治疗方案治疗的\n惊厥性癫痫持续状态初始 住院惊厥性癫痫持续状态患者数\n= ×100％\n治疗标准方案应用率 同期住院惊厥性癫痫\n持续状态患者总数\n意义：使用惊厥性癫痫持续状态治疗的初始治疗标准方案尽快控制发作，减少神经\n损伤，与患者预后密切相关。\n说明：初始治疗方案参考《成人全面性惊厥性癫痫持续状态治疗中国专家共识》。"}, {"name": "\u0007难治性惊厥性癫痫持续状态患者麻醉药物应用率", "code": "NEU-EPI-13", "definition": "单位时间内，住院难治 殖性肾 >50％的肾小球细胞增殖，像Ⅲ型病变一样细胞增殖可是节段或球性的，可见新\n小球肾炎） 月体。\nⅤ（晚期慢性肾小 40%或以上的肾小球球性硬化，和/或≥40%的小管萎缩或小管数减少（PAS），\n球肾炎） 组织学可表现为上述各种肾小球病变。\nOxford分型\n分型变量 评价内容\nM（系膜增殖） 超过一半的肾小球系膜区超过3个系膜细胞记为M1，否则为M0。\nE（内皮增殖） 肾小球毛细血管袢内细胞增殖引起袢腔狭窄记为E1，否则为E0。\nS（节段硬化） 节段硬化或球囊粘连记为S1，否则为S0。\nT（肾小管萎缩/间 肾小管萎缩或间质纤维化面积占肾皮质0-25%记为T0，26-50%记为T1，>50%\n质纤维化） 记为T2。\nC（细胞/纤维细 没有细胞/纤维细胞性新月体记为C0，细胞/纤维细胞性新月体比例<25%记\n胞性新月体） 为C1，细胞/纤维细胞性新月体比例≥25%记为C2。", "category": "肾病专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 118, "full_text": "IgA肾病患者病理分型诊断率（NEP-IgA-03）\n定义：肾活检术后2周内完成肾脏病理分型诊断的IgA肾病患者比例。\n计算公式：肾活检术后2周内完成肾脏病理分型\n诊断的IgA肾病患者数\nIgA肾病患者病理分型诊断率= ×100%\n同期完成肾脏病理诊断的\nIgA肾病患者总数\n意义：反映医疗机构IgA肾病患者病理分型规范诊断水平。\n说明：病理分型为Lee分级、Haas分型或Oxford分型中的任意一种即可。\nLee氏分级\n分级 评价内容\n肾小球绝大多数正常，偶尔轻度系膜增宽（节段）伴和（或）不伴细胞增殖，肾小管和肾\nⅠ级\n间质则没有改变。\nⅡ级 肾小球示局灶系膜增殖和硬化（<50%），有罕见小的新月体，肾小管和肾间质无损害。\n肾小球呈弥漫性系膜增殖和增宽（偶尔局灶节段），偶见小新月体和球囊粘连；局灶性肾\nⅢ级\n间质水肿，偶见细胞浸润，罕见肾小管萎缩。\n肾小球病变呈重度弥漫性系膜增殖和硬化，部分或全部肾小球硬化，可见新月体（<45%）。\nⅣ级\n肾小管萎缩，肾间质浸润，偶见肾间质泡沫细胞。\n肾小球病变的性质类似Ⅳ级，但更严重，肾小球新月体形成>45%；肾小管和肾间质病变类\nⅤ级\n似于Ⅳ级，但更严重。\nHaas分型\n分型 评价内容\nⅠ（轻微病变） 肾小球仅有轻度系膜细胞增殖；无节段硬化，无新月体。\nⅡ（FSGS样病变） 肾小球呈现类似特发性FSGS样改变；伴肾小球系膜细胞轻度增殖；无新月体。\n50％左右的肾小球细胞增殖，细胞增殖最初仅限于系膜区，或由于毛细血管内细\nⅢ（局灶增殖性肾\n胞增殖致肾小球毛细血管袢阻塞。可见新月体。绝大多数Ⅲ型病变示肾小球节段\n小球肾炎）\n细胞增殖（有的患者可无此病变）。\n续表\n分型 评价内容\nⅣ（弥漫增殖性肾 >50％的肾小球细胞增殖，像Ⅲ型病变一样细胞增殖可是节段或球性的，可见新\n小球肾炎） 月体。\nⅤ（晚期慢性肾小 40%或以上的肾小球球性硬化，和/或≥40%的小管萎缩或小管数减少（PAS），\n球肾炎） 组织学可表现为上述各种肾小球病变。\nOxford分型\n分型变量 评价内容\nM（系膜增殖） 超过一半的肾小球系膜区超过3个系膜细胞记为M1，否则为M0。\nE（内皮增殖） 肾小球毛细血管袢内细胞增殖引起袢腔狭窄记为E1，否则为E0。\nS（节段硬化） 节段硬化或球囊粘连记为S1，否则为S0。\nT（肾小管萎缩/间 肾小管萎缩或间质纤维化面积占肾皮质0-25%记为T0，26-50%记为T1，>50%\n质纤维化） 记为T2。\nC（细胞/纤维细 没有细胞/纤维细胞性新月体记为C0，细胞/纤维细胞性新月体比例<25%记\n胞性新月体） 为C1，细胞/纤维细胞性新月体比例≥25%记为C2。"}, {"name": "IgA肾病患者RAS阻断剂的使用率（NEP-IgA-04）", "code": "", "definition": "适合使用RAS阻断剂的IgA肾病患者中使用RAS阻断剂的比例。", "formula": "IgA肾病患者RAS 使用RAS阻断剂的IgA肾病患者数\n= ×100%\n阻断剂的使用率 同期适合使用RAS阻断剂的IgA肾病患者数", "significance": "反映医疗机构IgA肾病患者基础治疗达标水平。", "notes": "肾素-血管紧张素系统（RAS）阻断剂是指血管紧张素转化酶抑制剂如贝那\n普利、福辛普利、培哚普利等和血管紧张素受体拮抗剂如氯沙坦、厄 比例。\n计算公式：（1）维持性血液透析患者肾性贫血控制率（NEP-D-20A）。\n维持性血液透析患者 血红蛋白≥110g/L的维持性血液透析患者数\n= ×100%\n肾性贫血控制率 同期维持性血液透析患者总数\n（2）腹膜透析患者肾性贫血控制率（NEP-D-20B）。\n血红蛋白≥110g/L的腹膜透析患者数\n腹膜透析患者肾性贫血控制率= ×100%\n同期腹膜透析患者总数\n意义：反映医疗机构对患者肾性贫血管理情况。"}, {"name": "\u0007透析患者慢性肾脏病-矿物质与骨异常指标", "code": "CKD-MBD", "definition": "单位时间内，CKD-MBD指标控制达标的维持性血液透析/腹膜透析患者\n比例。", "formula": "（1）维持性血液透析患者CKD-MBD指标控制率。\n维持性血液透析患者 CKD-MBD指标控制达标的维持性血液透析患者数\n= ×100%\nCKD-MBD指标控制率 同期维持性血液透析患者总数\n（2）腹膜透析患者CKD-MBD指标控制率。\n腹膜透析患者CKD- CKD-MBD指标控制达标的腹膜透析患者数\n= ×100%\nMBD指标控制率 同期腹膜透析患者总数", "significance": "反映医疗机构对患者CKD-MBD管理情况。", "notes": "CKD-MBD指标控制达标的", "category": "肾病专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": ["<table class=\"indicator-table\">\n<tr><th>分级</th><th>评价内容</th></tr>\n<tr><td>Ⅰ级</td><td>肾小球绝大多数正常，偶尔轻度系膜增宽（节段）伴和（或）不伴细胞增殖，肾小管和肾<br>间质则没有改变。</td></tr>\n<tr><td>Ⅱ级</td><td>肾小球示局灶系膜增殖和硬化（<50%），有罕见小的新月体，肾小管和肾间质无损害。</td></tr>\n<tr><td>Ⅲ级</td><td>肾小球呈弥漫性系膜增殖和增宽（偶尔局灶节段），偶见小新月体和球囊粘连；局灶性肾<br>间质水肿，偶见细胞浸润，罕见肾小管萎缩。</td></tr>\n<tr><td>Ⅳ级</td><td>肾小球病变呈重度弥漫性系膜增殖和硬化，部分或全部肾小球硬化，可见新月体（<45%）。<br>肾小管萎缩，肾间质浸润，偶见肾间质泡沫细胞。</td></tr>\n<tr><td>Ⅴ级</td><td>肾小球病变的性质类似Ⅳ级，但更严重，肾小球新月体形成>45%；肾小管和肾间质病变类<br>似于Ⅳ级，但更严重。</td></tr>\n</table>", "<table class=\"indicator-table\">\n<tr><th>分型</th><th>评价内容</th></tr>\n<tr><td>Ⅰ（轻微病变）</td><td>肾小球仅有轻度系膜细胞增殖；无节段硬化，无新月体。</td></tr>\n<tr><td>Ⅱ（FSGS样病变）</td><td>肾小球呈现类似特发性FSGS样改变；伴肾小球系膜细胞轻度增殖；无新月体。</td></tr>\n<tr><td>Ⅲ（局灶增殖性肾<br>小球肾炎）</td><td>50％左右的肾小球细胞增殖，细胞增殖最初仅限于系膜区，或由于毛细血管内细<br>胞增殖致肾小球毛细血管袢阻塞。可见新月体。绝大多数Ⅲ型病变示肾小球节段<br>细胞增殖（有的患者可无此病变）。</td></tr>\n</table>", "<table class=\"indicator-table\">\n<tr><th>分型</th><th>评价内容</th></tr>\n<tr><td>Ⅳ（弥漫增殖性肾<br>小球肾炎）</td><td>>50％的肾小球细胞增殖，像Ⅲ型病变一样细胞增殖可是节段或球性的，可见新<br>月体。</td></tr>\n<tr><td>Ⅴ（晚期慢性肾小<br>球肾炎）</td><td>40%或以上的肾小球球性硬化，和/或≥40%的小管萎缩或小管数减少（PAS），<br>组织学可表现为上述各种肾小球病变。</td></tr>\n</table>", "<table class=\"indicator-table\">\n<tr><th>分型变量</th><th>评价内容</th></tr>\n<tr><td>M（系膜增殖）</td><td>超过一半的肾小球系膜区超过3个系膜细胞记为M1，否则为M0。</td></tr>\n<tr><td>E（内皮增殖）</td><td>肾小球毛细血管袢内细胞增殖引起袢腔狭窄记为E1，否则为E0。</td></tr>\n<tr><td>S（节段硬化）</td><td>节段硬化或球囊粘连记为S1，否则为S0。</td></tr>\n<tr><td>T（肾小管萎缩/间<br>质纤维化）</td><td>肾小管萎缩或间质纤维化面积占肾皮质0-25%记为T0，26-50%记为T1，>50%<br>记为T2。</td></tr>\n<tr><td>C（细胞/纤维细<br>胞性新月体）</td><td>没有细胞/纤维细胞性新月体记为C0，细胞/纤维细胞性新月体比例<25%记<br>为C1，细胞/纤维细胞性新月体比例≥25%记为C2。</td></tr>\n</table>"], "sub_indicators": [], "id": 146, "full_text": "\u0007透析患者慢性肾脏病-矿物质与骨异常指标\n定义：单位时间内，CKD-MBD指标控制达标的维持性血液透析/腹膜透析患者\n比例。\n计算公式：（1）维持性血液透析患者CKD-MBD指标控制率。\n维持性血液透析患者 CKD-MBD指标控制达标的维持性血液透析患者数\n= ×100%\nCKD-MBD指标控制率 同期维持性血液透析患者总数\n（2）腹膜透析患者CKD-MBD指标控制率。\n腹膜透析患者CKD- CKD-MBD指标控制达标的腹膜透析患者数\n= ×100%\nMBD指标控制率 同期腹膜透析患者总数\n意义：反映医疗机构对患者CKD-MBD管理情况。\n说明：CKD-MBD指标控制达标的"}, {"name": "透析患者血清白蛋白控制率", "code": "NEP-D-22", "definition": "单位时间内，血清白蛋白≥35g/L的维持性血液透析/腹膜透析患者比例。", "formula": "（1）维持性血液透析患者血清白蛋白控制率（NEP-D-22A）。\n维持性血液透析患者 血清白蛋白≥35g/L的维持性血液透析患者数\n= ×100%\n血清白蛋白控制率 同期维持性血液透析患者总数\n（2）腹膜透析患者血清白蛋白控制率（NEP-D-22B）。\n腹膜透析患者血清白 血清白蛋白≥35g/L的腹膜透析患者数\n= ×100%\n蛋白控制率 同期腹膜透析患者总数", "significance": "反映医疗机构对患者营养状态管理情况。", "notes": "", "category": "肾病专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 147, "full_text": "透析患者血清白蛋白控制率\n定义：单位时间内，血清白蛋白≥35g/L的维持性血液透析/腹膜透析患者比例。\n计算公式：（1）维持性血液透析患者血清白蛋白控制率（NEP-D-22A）。\n维持性血液透析患者 血清白蛋白≥35g/L的维持性血液透析患者数\n= ×100%\n血清白蛋白控制率 同期维持性血液透析患者总数\n（2）腹膜透析患者血清白蛋白控制率（NEP-D-22B）。\n腹膜透析患者血清白 血清白蛋白≥35g/L的腹膜透析患者数\n= ×100%\n蛋白控制率 同期腹膜透析患者总数\n意义：反映医疗机构对患者营养状态管理情况。"}, {"name": "床护比", "code": "NQI-01", "definition": "单位时间内，医疗机构实际开放床位与医疗机构执业护士人数的比。", "formula": "医疗机构执业护士人数\n医疗机构床护比（1：X）=1：\n同期实际开放床位数\n（二）病区床护比（NQI-01B）。", "significance": "反映医疗机构实际开放床位和护理人力的匹配关系。了解当前实际开放床位\n所配备的护理人力配备状况，建立一种以实际开放床位为导向的护理人力配备管理模式，\n保障一定数量开放床位病区的基本护理人力配备。为医疗机构及其病区护理人力配备提\n供参考、评价指标。评价医疗机构、病区或重症医学科基本护理人力配备情况，可进行\n同级别医疗机构横向比较。", "notes": "（1）护士指取得护士执业资格、在本医疗机构注册并在护理岗位工作的护士。\n包含：临床护理岗位护士、护理管理岗位护士、其它护理岗位护士、护理岗位的返\n聘护士、护理岗位的休假（含病产假）护士。\n排除：医疗机构职能部门、后勤部门、医保等非护理岗位护士，未取得护士执业资\n格人员，未在本院注册的护士。\n（2）实际开放床位数指医疗机构实际长期固定开放的床位数。\n包含：编制床位数；除编制床位外，经医疗机构确认有固定物理空间和标准床单位\n配置、可以常规收治患者的床位数；开放时间≥统计周期1/2的床位数。\n排除：急诊抢救床位、急诊观察床位、手术室床位、麻醉恢复室床位、血液透析室\n床位、接产室的待产床和接产床、母婴同室新生儿床、检查床、治疗床、临时加床。\n（3）病区指医疗机构有实际住院床位的病区的总称（包含重症医学科）。\n（4）重症医学科指独立设置的收治危重患者的科室或病区，其人员管理和使用应当\n独立于其他科室或病区。\n包含：综合重症监护病房（综合ICU）、独立的专科重症监护病房（如：呼吸科重\n症监护病房（RICU）、新生儿重症监护病房（NICU）等）。\n排除：科室内部设立的重症监护病床、与其他科室或病区存在人员交叉管理使用的\n重症监护病区。\n（5）儿科病区指独立设置的收治儿童患者（小于等于18岁）的病区。\n包含：儿童呼吸、消化、神经、泌尿、血液、内分泌等内外科疾病的儿童病区。\n排除：新生儿病区、新生儿重症监护病区（NICU）、儿童重症监护病区（PICU）、\n儿科门诊、急诊等。", "category": "护理专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 148, "full_text": "床护比\n定义：单位时间内，医疗机构实际开放床位与医疗机构执业护士人数的比。\n计算公式：医疗机构执业护士人数\n医疗机构床护比（1：X）=1：\n同期实际开放床位数\n（二）病区床护比（NQI-01B）。\n意义：反映医疗机构实际开放床位和护理人力的匹配关系。了解当前实际开放床位\n所配备的护理人力配备状况，建立一种以实际开放床位为导向的护理人力配备管理模式，\n保障一定数量开放床位病区的基本护理人力配备。为医疗机构及其病区护理人力配备提\n供参考、评价指标。评价医疗机构、病区或重症医学科基本护理人力配备情况，可进行\n同级别医疗机构横向比较。\n说明：（1）护士指取得护士执业资格、在本医疗机构注册并在护理岗位工作的护士。\n包含：临床护理岗位护士、护理管理岗位护士、其它护理岗位护士、护理岗位的返\n聘护士、护理岗位的休假（含病产假）护士。\n排除：医疗机构职能部门、后勤部门、医保等非护理岗位护士，未取得护士执业资\n格人员，未在本院注册的护士。\n（2）实际开放床位数指医疗机构实际长期固定开放的床位数。\n包含：编制床位数；除编制床位外，经医疗机构确认有固定物理空间和标准床单位\n配置、可以常规收治患者的床位数；开放时间≥统计周期1/2的床位数。\n排除：急诊抢救床位、急诊观察床位、手术室床位、麻醉恢复室床位、血液透析室\n床位、接产室的待产床和接产床、母婴同室新生儿床、检查床、治疗床、临时加床。\n（3）病区指医疗机构有实际住院床位的病区的总称（包含重症医学科）。\n（4）重症医学科指独立设置的收治危重患者的科室或病区，其人员管理和使用应当\n独立于其他科室或病区。\n包含：综合重症监护病房（综合ICU）、独立的专科重症监护病房（如：呼吸科重\n症监护病房（RICU）、新生儿重症监护病房（NICU）等）。\n排除：科室内部设立的重症监护病床、与其他科室或病区存在人员交叉管理使用的\n重症监护病区。\n（5）儿科病区指独立设置的收治儿童患者（小于等于18岁）的病区。\n包含：儿童呼吸、消化、神经、泌尿、血液、内分泌等内外科疾病的儿童病区。\n排除：新生儿病区、新生儿重症监护病区（NICU）、儿童重症监护病区（PICU）、\n儿科门诊、急诊等。"}, {"name": "护患比", "code": "NQI-02", "definition": "单位时间内，每天白班责任护士数之和与其负责照护的住院患者数之和的比。", "formula": "每天白班护理患者数之和\n白班平均护患比（1：X）=1：\n同期每天白班责任护士数之和\n（二）夜班平均护患比（NQI-02B）。", "significance": "反映的是需要照护的住院患者数量和护理人力的匹配关系，评价医疗机构及\n各病区有效护士人力配备情况，进而建立一种以护理服务需求为导向，科学调配护理人\n力的管理模式，让需要照护的患者获得充足的护理服务，保障患者的安全和护理服务质\n量。关联护理结果质量指标分析，发现护患比对护理质量存在关联规律和影响，可进行\n同级别医疗机构的横向比较。", "notes": "因各医疗机构护理班次存在差异，统计时以8小时为一个班次标准工作时\n长，责任护士每工作8小时计为1名护士人力，患者每被护理8小时计为1名患者护理\n工作量。\n（1）责任护士指直接护理患者的执业护士。某班责任护士数=某班次时段内所有责\n任护士上班小时数之和÷8。\n排除：治疗护士、办公班护士、配药护士和护士长（一般情况下，护士长不计算在\n内，当护士长承担了责任护士的工作时才计算在内）。\n（2）护理患者数：单位时间内护理住院患者的护理工作量。 某白班护理患者数=\n（白班接班时在院患者数+白班时段内新入院患者数）×（白班时长÷8）。某夜班护理\n患者数=（夜班接班时在院患者数+夜班时段内新入院患者数）×（夜班时长÷8）。\n（3）患者指住院患者，包含所有办理住院手续的患者。不包括办理住院手续但实际\n未到达病区患者；母婴同室新生儿。", "category": "护理专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 149, "full_text": "护患比\n定义：单位时间内，每天白班责任护士数之和与其负责照护的住院患者数之和的比。\n计算公式：每天白班护理患者数之和\n白班平均护患比（1：X）=1：\n同期每天白班责任护士数之和\n（二）夜班平均护患比（NQI-02B）。\n意义：反映的是需要照护的住院患者数量和护理人力的匹配关系，评价医疗机构及\n各病区有效护士人力配备情况，进而建立一种以护理服务需求为导向，科学调配护理人\n力的管理模式，让需要照护的患者获得充足的护理服务，保障患者的安全和护理服务质\n量。关联护理结果质量指标分析，发现护患比对护理质量存在关联规律和影响，可进行\n同级别医疗机构的横向比较。\n说明：因各医疗机构护理班次存在差异，统计时以8小时为一个班次标准工作时\n长，责任护士每工作8小时计为1名护士人力，患者每被护理8小时计为1名患者护理\n工作量。\n（1）责任护士指直接护理患者的执业护士。某班责任护士数=某班次时段内所有责\n任护士上班小时数之和÷8。\n排除：治疗护士、办公班护士、配药护士和护士长（一般情况下，护士长不计算在\n内，当护士长承担了责任护士的工作时才计算在内）。\n（2）护理患者数：单位时间内护理住院患者的护理工作量。 某白班护理患者数=\n（白班接班时在院患者数+白班时段内新入院患者数）×（白班时长÷8）。某夜班护理\n患者数=（夜班接班时在院患者数+夜班时段内新入院患者数）×（夜班时长÷8）。\n（3）患者指住院患者，包含所有办理住院手续的患者。不包括办理住院手续但实际\n未到达病区患者；母婴同室新生儿。"}, {"name": "每住院患者24小时平均护理时数", "code": "NQI-03", "definition": "单位时间内，医疗机构病区执业护士实际上班小时数与住院患者实际占用床\n日数的比。", "formula": "医疗机构病区执业护士实际上班小时数\n每住院患者24小时平均护理时数=\n同期住院患者实际占用床日数", "significance": "反映每住院患者平均每天实际得到的护理时间，包括直接护理时数、间接护\n理时数、相关护理时数。监测每住院患者24小时平均护理时数可以帮助管理者了解患者\n所得到的护理服务时长，进而推算出护理工作负荷及患者所需的护理服务时数，指导管\n理者合理地调配护理人员，帮助促进护理工作效率提升，将更多护士工作时间用于照护\n患者。", "notes": "（1）医疗机构病区执业护士实际上班小时数为单位时间内医疗机构病区所有\n执业护士实际上班小时数之和。\n包含：病区护士上班小时数、病区护士长上班小时数、病区返聘护士上班小时数、\n执业地点变更到医疗机构的规培/进修护士上班小时数。\n排除：未取得护士执业资格人员上班小时数、非病区护士上班小时数，如手术室、\n门诊、血液透析室等。\n（2）住院患者实际占用床日数即为单位时间内医疗机构各科室每天0点住院患者实\n际占用的床日数总和。\n包含：占用的正规病床日数、占用的临时加床日数。\n排除：占用的急诊抢救床日数、急诊观察床日数、手术室床日数、麻醉恢复室床日\n数、血液透析室床日数、接产室的待产床和接产床的床日数、母婴同室新生儿床日数、\n检查床床日数和治疗床床日数。", "category": "护理专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 150, "full_text": "每住院患者24小时平均护理时数\n定义：单位时间内，医疗机构病区执业护士实际上班小时数与住院患者实际占用床\n日数的比。\n计算公式：医疗机构病区执业护士实际上班小时数\n每住院患者24小时平均护理时数=\n同期住院患者实际占用床日数\n意义：反映每住院患者平均每天实际得到的护理时间，包括直接护理时数、间接护\n理时数、相关护理时数。监测每住院患者24小时平均护理时数可以帮助管理者了解患者\n所得到的护理服务时长，进而推算出护理工作负荷及患者所需的护理服务时数，指导管\n理者合理地调配护理人员，帮助促进护理工作效率提升，将更多护士工作时间用于照护\n患者。\n说明：（1）医疗机构病区执业护士实际上班小时数为单位时间内医疗机构病区所有\n执业护士实际上班小时数之和。\n包含：病区护士上班小时数、病区护士长上班小时数、病区返聘护士上班小时数、\n执业地点变更到医疗机构的规培/进修护士上班小时数。\n排除：未取得护士执业资格人员上班小时数、非病区护士上班小时数，如手术室、\n门诊、血液透析室等。\n（2）住院患者实际占用床日数即为单位时间内医疗机构各科室每天0点住院患者实\n际占用的床日数总和。\n包含：占用的正规病床日数、占用的临时加床日数。\n排除：占用的急诊抢救床日数、急诊观察床日数、手术室床日数、麻醉恢复室床日\n数、血液透析室床日数、接产室的待产床和接产床的床日数、母婴同室新生儿床日数、\n检查床床日数和治疗床床日数。"}, {"name": "不同级别护士配置占比", "code": "NQI-04", "definition": "单位时间内，在病区工作、工作年限＜5年的护士在病区执业护士中所占的\n比例。", "formula": "病区工作年限＜5年的护士总数\n病区5年以下护士占比= ×100%\n同期病区执业护士总人数\n（二）病区20年及以上护士占比（NQI-04B）。", "significance": "工作年限可以在一定程度反应护理人员能力水平。分析不同级别护士的配置，\n旨在让护理管理者关注护理团队的数量和规模的同时，还要关注护理团队的能力结构。", "notes": "（1）工作年限：指护士在医疗机构注册以后的工作时间。包括在其他医疗机\n构参加工作的时间、试用期。不包括实习期、待业期。\n（2）病区指医疗机构有实际住院床位的病区的总称（包含重症医学科）。\n（3）病区护士指取得护士执业资格、在本医疗机构注册并在病区护理岗位工作的护士。\n包含：病区临床护理岗位护士、病区护士长（副护士长）、病区护理岗位的休假\n（含病产假）护士。", "category": "护理专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 151, "full_text": "不同级别护士配置占比\n定义：单位时间内，在病区工作、工作年限＜5年的护士在病区执业护士中所占的\n比例。\n计算公式：病区工作年限＜5年的护士总数\n病区5年以下护士占比= ×100%\n同期病区执业护士总人数\n（二）病区20年及以上护士占比（NQI-04B）。\n意义：工作年限可以在一定程度反应护理人员能力水平。分析不同级别护士的配置，\n旨在让护理管理者关注护理团队的数量和规模的同时，还要关注护理团队的能力结构。\n说明：（1）工作年限：指护士在医疗机构注册以后的工作时间。包括在其他医疗机\n构参加工作的时间、试用期。不包括实习期、待业期。\n（2）病区指医疗机构有实际住院床位的病区的总称（包含重症医学科）。\n（3）病区护士指取得护士执业资格、在本医疗机构注册并在病区护理岗位工作的护士。\n包含：病区临床护理岗位护士、病区护士长（副护士长）、病区护理岗位的休假\n（含病产假）护士。"}, {"name": "护士离职率", "code": "NQI-05", "definition": "单位时间内，某医疗机构护士离职人数与执业护士总人数的比例。", "formula": "护士离职人数\n护士离职率= ×100%\n（期初医疗机构执业护士总人数+期末医疗机构执业护士总人数）/2", "significance": "反映医疗机构组织与护理队伍是否稳定的重要指标。衡量护士人力资源流动\n状况，了解护士离职的现状，分析离职原因及对组织结构和护理质量造成的影响，为管\n理者制定人员招聘和培训计划，改善管理策略等方面提供依据。", "notes": "离职指自愿离职。\n排除：因退休、死亡或被辞退而离开医疗机构的护士；在同一医疗机构岗位调整的\n护士。", "category": "护理专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 152, "full_text": "护士离职率\n定义：单位时间内，某医疗机构护士离职人数与执业护士总人数的比例。\n计算公式：护士离职人数\n护士离职率= ×100%\n（期初医疗机构执业护士总人数+期末医疗机构执业护士总人数）/2\n意义：反映医疗机构组织与护理队伍是否稳定的重要指标。衡量护士人力资源流动\n状况，了解护士离职的现状，分析离职原因及对组织结构和护理质量造成的影响，为管\n理者制定人员招聘和培训计划，改善管理策略等方面提供依据。\n说明：离职指自愿离职。\n排除：因退休、死亡或被辞退而离开医疗机构的护士；在同一医疗机构岗位调整的\n护士。"}, {"name": "住院患者身体约束率", "code": "NQI-06", "definition": "单位时间内，住院患者身体约束日数与住院患者实际占用床日数的比例。", "formula": "住院患者身体约束日数\n住院患者身体约束率= ×100%\n同期住院患者实际占用床日数", "significance": "身体约束以避免自我伤害、非计划拔管、坠床等保障患者安全为目的，是在\n医疗机构部分领域经常采取的护理行为。通过对住院患者身体约束率的监测，医疗机构\n或护理部门能够及时获得身体约束率、约束导致的不良事件和约束的其他相关信息。通\n过根本原因分析，找到过度使用身体约束的影响因素。通过医疗机构管理团队和医务人\n员的共同努力，找到有效的替代措施，努力降低身体约束率或使身体约束更具合理化，\n减少因身体约束带来的负性质量问题，从而提高住院患者的安全，提高人文护理质量。", "notes": "（1）身体约束是指通过使用相关器具或设备附加在或临近于患者的身体（该\n器具或设备不能被患者自行控制或轻易移除），限制其身体或身体某部位自由活动和\n（或）触及自己身体的某部位。\n（2）单位时间内每位住院患者每天不论约束1个或多个部位、不论约束时长，均计\n为1日。\n排除：术中因体位需要的约束；麻醉恢复室的约束；药物约束；床档约束（为预防\n患者坠床等原因使用护栏固定于床边两侧）；因疾病需要的空间约束；矫形器、模型固\n定器、牵引器等治疗设施的固定；儿童注射临时制动；新生儿日常包裹。", "category": "护理专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 153, "full_text": "住院患者身体约束率\n定义：单位时间内，住院患者身体约束日数与住院患者实际占用床日数的比例。\n计算公式：住院患者身体约束日数\n住院患者身体约束率= ×100%\n同期住院患者实际占用床日数\n意义：身体约束以避免自我伤害、非计划拔管、坠床等保障患者安全为目的，是在\n医疗机构部分领域经常采取的护理行为。通过对住院患者身体约束率的监测，医疗机构\n或护理部门能够及时获得身体约束率、约束导致的不良事件和约束的其他相关信息。通\n过根本原因分析，找到过度使用身体约束的影响因素。通过医疗机构管理团队和医务人\n员的共同努力，找到有效的替代措施，努力降低身体约束率或使身体约束更具合理化，\n减少因身体约束带来的负性质量问题，从而提高住院患者的安全，提高人文护理质量。\n说明：（1）身体约束是指通过使用相关器具或设备附加在或临近于患者的身体（该\n器具或设备不能被患者自行控制或轻易移除），限制其身体或身体某部位自由活动和\n（或）触及自己身体的某部位。\n（2）单位时间内每位住院患者每天不论约束1个或多个部位、不论约束时长，均计\n为1日。\n排除：术中因体位需要的约束；麻醉恢复室的约束；药物约束；床档约束（为预防\n患者坠床等原因使用护栏固定于床边两侧）；因疾病需要的空间约束；矫形器、模型固\n定器、牵引器等治疗设施的固定；儿童注射临时制动；新生儿日常包裹。"}, {"name": "住院患者跌倒发生率", "code": "NQI-07", "definition": "单位时间内，住院患者发生跌倒例次数（包括造成或未造成伤害）与住院患\n者实际占用床日数的千分比。", "formula": "住院患者跌倒例次数\n住院患者跌倒发生率= ×1000‰\n同期住院患者实际占用床日数", "significance": "患者发生跌倒可能造成伤害，导致严重甚至危及生命的后果。通过对住院患\n者跌倒发生指标的监测，了解所在医疗机构或部门的跌倒发生率和伤害占比。通过根本\n原因分析和有效的对策实施，可以降低患者跌倒的风险及跌倒发生率，保障患者安全。", "notes": "统计住院患者在医疗机构任何场所发生的跌倒例次数。同一患者多次跌倒按\n实际发生例次计算。\n包含：坠床。\n排除：非医疗机构场所发生的跌倒、非住院患者（门诊、急诊留观室等）发生的跌\n倒、住院患儿生理性跌倒（小儿行走中无伤害跌倒）。\n（二）住院患者跌倒伤害占比（NQI-07B）。", "category": "护理专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 154, "full_text": "住院患者跌倒发生率\n定义：单位时间内，住院患者发生跌倒例次数（包括造成或未造成伤害）与住院患\n者实际占用床日数的千分比。\n计算公式：住院患者跌倒例次数\n住院患者跌倒发生率= ×1000‰\n同期住院患者实际占用床日数\n意义：患者发生跌倒可能造成伤害，导致严重甚至危及生命的后果。通过对住院患\n者跌倒发生指标的监测，了解所在医疗机构或部门的跌倒发生率和伤害占比。通过根本\n原因分析和有效的对策实施，可以降低患者跌倒的风险及跌倒发生率，保障患者安全。\n说明：统计住院患者在医疗机构任何场所发生的跌倒例次数。同一患者多次跌倒按\n实际发生例次计算。\n包含：坠床。\n排除：非医疗机构场所发生的跌倒、非住院患者（门诊、急诊留观室等）发生的跌\n倒、住院患儿生理性跌倒（小儿行走中无伤害跌倒）。\n（二）住院患者跌倒伤害占比（NQI-07B）。"}, {"name": "住院患者2期及以上院内压力性损伤发生率", "code": "NQI-08", "definition": "单位时间内，住院患者2期及以上院内压力性损伤新发病例数与住院患者总\n数的比例。", "formula": "住院患者2期及以上院 住院患者2期及以上院内压力性损伤新发病例数\n= ×100%\n内压力性损伤发生率 同期住院患者总数", "significance": "反映医疗机构院内压力性损伤发生的现状，与同级医疗机构进行横向比较，\n评价医疗机构压力性损伤管理的质量。", "notes": "（1）单位时间内患者入院24小时后新发的2期及以上压力性损伤例数。院\n外带入压力性损伤患者，若入院24小时后新发生的2期及以上压力性损伤计作1例。\n同一患者单位时间内发生1处或多处2期及以上压力性损伤（包括在不同科室发生的压\n力性损伤），均计作1例，期别按最高期别统计。压力性损伤分期依照《美国国家压疮\n咨询委员会：压力性损伤定义与分期（2016版）》界定。\n包含：2期及以上压力性损伤，深部组织损伤、不可分期、医疗器械相关性压力性\n损伤、粘膜压力性损伤。\n排除：因动脉阻塞、静脉功能不全、糖尿病相关神经病变或失禁性皮炎等造成的皮\n肤损伤；社区获得性压力性损伤。\n（2）住院患者总数为统计周期期初在院患者数与单位时间内新入院患者数之和。\n包含：所有办理住院手续的患者。\n排除：办理住院手续但实际未到达病区患者；母婴同室新生儿。", "category": "护理专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 155, "full_text": "住院患者2期及以上院内压力性损伤发生率\n定义：单位时间内，住院患者2期及以上院内压力性损伤新发病例数与住院患者总\n数的比例。\n计算公式：住院患者2期及以上院 住院患者2期及以上院内压力性损伤新发病例数\n= ×100%\n内压力性损伤发生率 同期住院患者总数\n意义：反映医疗机构院内压力性损伤发生的现状，与同级医疗机构进行横向比较，\n评价医疗机构压力性损伤管理的质量。\n说明：（1）单位时间内患者入院24小时后新发的2期及以上压力性损伤例数。院\n外带入压力性损伤患者，若入院24小时后新发生的2期及以上压力性损伤计作1例。\n同一患者单位时间内发生1处或多处2期及以上压力性损伤（包括在不同科室发生的压\n力性损伤），均计作1例，期别按最高期别统计。压力性损伤分期依照《美国国家压疮\n咨询委员会：压力性损伤定义与分期（2016版）》界定。\n包含：2期及以上压力性损伤，深部组织损伤、不可分期、医疗器械相关性压力性\n损伤、粘膜压力性损伤。\n排除：因动脉阻塞、静脉功能不全、糖尿病相关神经病变或失禁性皮炎等造成的皮\n肤损伤；社区获得性压力性损伤。\n（2）住院患者总数为统计周期期初在院患者数与单位时间内新入院患者数之和。\n包含：所有办理住院手续的患者。\n排除：办理住院手续但实际未到达病区患者；母婴同室新生儿。"}, {"name": "置管患者非计划拔管率", "code": "NQI-09", "definition": "非计划拔管又称意外拔管，是指住院患者有意造成或任何意外所致的拔管，\n即医护人员非诊疗计划范畴内的拔管。某类导管非计划拔管率指单位时间内住院患者发\n生某类导管非计划拔管的例次数与该类导管留置总日数的千分比。", "formula": "（一）气管导管（气管插管、气管切开）非计划拔管率。\n气管导管（气管插管、气管切开）\n气管导管（气管插管、气 非计划拔管例次数\n= ×1000‰\n管切开）非计划拔管率 同期气管导管（气管插管、气管切开）\n留置总日数）\n（二）经口、经鼻胃肠导管非计划拔管率。\n经口、经鼻胃肠导 经口、经鼻胃肠导管非计划拔管例次数\n= ×1000‰\n管非计划拔管率 同期经口、经鼻胃肠导管留置总日数\n（三）导尿管非计划拔管率。\n导尿管非计划拔管例次数\n导尿管非计划拔管率= ×1000‰\n同期导尿管留置总日数\n（四）中心静脉导管（CVC）非计划拔管率。\nCVC非计划拔管例次数\nCVC非计划拔管率= ×1000‰\n同期 CVC留置总日数\n（五）经外周置入中心静脉导管（PICC）非计划拔管率。\nPICC非计划拔管例次数\nPICC非计划拔管率= ×1000‰\n同期PICC留置总日数", "significance": "有助于及时发现导管非计划拔管的现状、趋势、特征及危险因素，为其预\n防、控制和制定质量改进目标提供科学依据，提升医护团队服务的规范性、专业性。", "notes": "（1）某导管非计划拔管例次数指单位时间内留置某类导管的住院患者发生该\n类导管非计划拔管的例次数。同一住院患者在单位时间内发生的导管非计划拔管例次数\n按实际发生频次计算。\n包含：患者自行拔除的导管；各种原因导致的导管滑脱；因导管质量问题及导管堵\n塞等情况需要提前拔除的导管；因导管相关感染需提前拔除的导管。\n排除：医生根据患者病情转归程度，达到拔除导管指征，医嘱拔除导管；导管留置\n时间达到上限，应拔除或更换导管；非住院患者拔管，如门诊患者和急诊抢救患者。\n（2）某导管留置总日数指单位时间内住院患者留置某类导管的日数之和。留置导管\n每跨越0点1次计作1日，当天置入并拔除的不统计。带管入院患者以入院当日开始，\n每跨越0点1次计作1日；带管出院患者以出院日期为止。\n包含：住院患者留置某类导管处于长期医嘱执行状态的日数。\n排除：一次性插管患者插管日数、门急诊等非住院病区置管患者的留置日数。", "category": "护理专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 156, "full_text": "置管患者非计划拔管率\n定义：非计划拔管又称意外拔管，是指住院患者有意造成或任何意外所致的拔管，\n即医护人员非诊疗计划范畴内的拔管。某类导管非计划拔管率指单位时间内住院患者发\n生某类导管非计划拔管的例次数与该类导管留置总日数的千分比。\n计算公式：（一）气管导管（气管插管、气管切开）非计划拔管率。\n气管导管（气管插管、气管切开）\n气管导管（气管插管、气 非计划拔管例次数\n= ×1000‰\n管切开）非计划拔管率 同期气管导管（气管插管、气管切开）\n留置总日数）\n（二）经口、经鼻胃肠导管非计划拔管率。\n经口、经鼻胃肠导 经口、经鼻胃肠导管非计划拔管例次数\n= ×1000‰\n管非计划拔管率 同期经口、经鼻胃肠导管留置总日数\n（三）导尿管非计划拔管率。\n导尿管非计划拔管例次数\n导尿管非计划拔管率= ×1000‰\n同期导尿管留置总日数\n（四）中心静脉导管（CVC）非计划拔管率。\nCVC非计划拔管例次数\nCVC非计划拔管率= ×1000‰\n同期 CVC留置总日数\n（五）经外周置入中心静脉导管（PICC）非计划拔管率。\nPICC非计划拔管例次数\nPICC非计划拔管率= ×1000‰\n同期PICC留置总日数\n意义：有助于及时发现导管非计划拔管的现状、趋势、特征及危险因素，为其预\n防、控制和制定质量改进目标提供科学依据，提升医护团队服务的规范性、专业性。\n说明：（1）某导管非计划拔管例次数指单位时间内留置某类导管的住院患者发生该\n类导管非计划拔管的例次数。同一住院患者在单位时间内发生的导管非计划拔管例次数\n按实际发生频次计算。\n包含：患者自行拔除的导管；各种原因导致的导管滑脱；因导管质量问题及导管堵\n塞等情况需要提前拔除的导管；因导管相关感染需提前拔除的导管。\n排除：医生根据患者病情转归程度，达到拔除导管指征，医嘱拔除导管；导管留置\n时间达到上限，应拔除或更换导管；非住院患者拔管，如门诊患者和急诊抢救患者。\n（2）某导管留置总日数指单位时间内住院患者留置某类导管的日数之和。留置导管\n每跨越0点1次计作1日，当天置入并拔除的不统计。带管入院患者以入院当日开始，\n每跨越0点1次计作1日；带管出院患者以出院日期为 别\n护理患者数，分别累计求和。同一患者一天内护理级别有变化时，只能计算一次，以统\n计时点的护理级别为准。", "category": "护理专业医疗质量控制指标（2020年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 159, "full_text": "护理级别占比\n定义：单位时间内，医疗机构某级别护理患者占用床日数与住院患者实际占用床日\n数的百分比。\n计算公式：（一）特级护理占比。\n特级护理患者占用床日数\n特级护理占比= ×100%\n住院患者实际占用床日数\n（二）一级护理占比。\n一级护理患者占用床日数\n一级护理占比＝ ×100%\n住院患者实际占用床日数\n（三）二级护理占比。\n二级护理患者占用床日数\n二级护理占比＝ ×100%\n住院患者实际占用床日数\n（四）三级护理占比。\n三级护理患者占用床日数\n三级护理占比＝ ×100%\n住院患者实际占用床日数\n意义：反映患者病情的轻重缓急及护理需求和护理工作量，可以帮助管理者推算出\n护理工作负荷，是合理安排护理人力资源的重要依据，对临床护理管理和人力调配起着\n指导作用。\n说明：患者的护理级别是由医生和护士共同确定。某级别护理患者占用床日数指单\n位时间内执行该级别护理的患者占用的床日数之和，即单位时间内每天0点统计各级别\n护理患者数，分别累计求和。同一患者一天内护理级别有变化时，只能计算一次，以统\n计时点的护理级别为准。"}, {"name": "住院病案管理人员月均负担出院患者病历数", "code": "MER-HR-01", "definition": "单位时间内，每名住院病案管理人员每月平均负担的出院患者病历数。", "formula": "出院患者病历总数\n住院病案管理人员月均负担出院患者病历数=\n同期住院病案管理人员实际工作总月数", "significance": "", "notes": "1.住院病案管理人员是指专职从事住院病历回收、整理、扫描、装订、归\n档、复印、借阅、编码、统计及质量控制等工作的人员。\n2.实际工作总月数等于每名工作人员实际工作月数的总和（下同）。", "category": "病案管理质量控制指标（2021年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 160, "full_text": "住院病案管理人员月均负担出院患者病历数\n定义：单位时间内，每名住院病案管理人员每月平均负担的出院患者病历数。\n计算公式：出院患者病历总数\n住院病案管理人员月均负担出院患者病历数=\n同期住院病案管理人员实际工作总月数\n说明：1.住院病案管理人员是指专职从事住院病历回收、整理、扫描、装订、归\n档、复印、借阅、编码、统计及质量控制等工作的人员。\n2.实际工作总月数等于每名工作人员实际工作月数的总和（下同）。"}, {"name": "门诊病案管理人员月均负担门诊患者病历数", "code": "MER-HR-02", "definition": "单位时间内，每名门诊病案管理人员每月平均负担的门诊患者病历数。", "formula": "门诊患者病历总数\n门诊病案管理人员月均负担门诊患者病历数=\n同期门诊病案管理人员实际工作总月数", "significance": "", "notes": "1.门诊病案管理人员是指专职从事门诊病案资料整理、装订、归档、复印、\n借阅、编码、统计及质量控制等工作的人员。\n2.门诊患者病历总数按同期门诊实际诊疗人次计算。", "category": "病案管理质量控制指标（2021年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 161, "full_text": "门诊病案管理人员月均负担门诊患者病历数\n定义：单位时间内，每名门诊病案管理人员每月平均负担的门诊患者病历数。\n计算公式：门诊患者病历总数\n门诊病案管理人员月均负担门诊患者病历数=\n同期门诊病案管理人员实际工作总月数\n说明：1.门诊病案管理人员是指专职从事门诊病案资料整理、装订、归档、复印、\n借阅、编码、统计及质量控制等工作的人员。\n2.门诊患者病历总数按同期门诊实际诊疗人次计算。"}, {"name": "病案编码人员月均负担出院患者病历数（\u0007 MER-HR-03）", "code": "", "definition": "单位时间内，每名病案编码人员每月平均负担的出院患者病历数。",  "code": "NUT-S-03", "definition": "营养科技师总数与同期医疗机构实际开放床位数之比。", "formula": "营养科技师总数\n营养科技床比=\n同期医疗机构实际开放床位数", "significance": "反映医疗机构营养科技师资源配置情况。", "notes": "营养科技师指取得相关专业技术资格，在本医疗机构注册并从事技师工作的\n营养科在职人员。", "category": "临床营养专业医疗质量控制指标（2022年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 320, "full_text": "营养科技床比\n定义：营养科技师总数与同期医疗机构实际开放床位数之比。\n计算公式：营养科技师总数\n营养科技床比=\n同期医疗机构实际开放床位数\n意义：反映医疗机构营养科技师资源配置情况。\n说明：营养科技师指取得相关专业技术资格，在本医疗机构注册并从事技师工作的\n营养科在职人员。"}, {"name": "住院患者营养风险筛查率", "code": "NUT-P-01", "definition": "完成营养风险筛查住院患者数占同期住院患者总数的比例。", "formula": "完成营养风险筛查住院患者数\n住院患者营养风险筛查率= ×100%\n同期住院患者总数", "significance": "反映医疗机构对住院患者营养状况重视程度及营养风险筛查的规范开展\n情况。", "notes": "1.营养风险筛查指由受过相关培训的医师采用经验证的营养风险筛查工具，进行营\n养风险筛查。\n2.营养风险指现存或潜在的与营养因素相关的导致患者出现不利临床结局（如感染\n相关并发症发生率增高、住院时间延长、住院费用增加等）的风险，而非指发生营养不\n良的风险。\n3.营养风险与临床结局密切相关，并可监测患者营养治疗效果。", "category": "临床营养专业医疗质量控制指标（2022年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 321, "full_text": "住院患者营养风险筛查率\n定义：完成营养风险筛查住院患者数占同期住院患者总数的比例。\n计算公式：完成营养风险筛查住院患者数\n住院患者营养风险筛查率= ×100%\n同期住院患者总数\n意义：反映医疗机构对住院患者营养状况重视程度及营养风险筛查的规范开展\n情况。\n说明：1.营养风险筛查指由受过相关培训的医师采用经验证的营养风险筛查工具，进行营\n养风险筛查。\n2.营养风险指现存或潜在的与营养因素相关的导致患者出现不利临床结局（如感染\n相关并发症发生率增高、住院时间延长、住院费用增加等）的风险，而非指发生营养不\n良的风险。\n3.营养风险与临床结局密切相关，并可监测患者营养治疗效果。"}, {"name": "存在营养风险住院患者营养治疗率", "code": "NUT-P-02", "definition": "经营养风险筛查，存在营养风险并接受营养治疗的住院患者数占同期存在营\n养风险住院患者总数的比例。", "formula": "存在营养风险住院 存在营养风险并接受营养治疗的住院患者数\n= ×100%\n患者营养治疗率 同期存在营养风险住院患者总数", "significance": "反映医疗机构营养治疗覆盖率及规范开展情况。", "notes": "1.存在营养风险指使用经验证的营养风险筛查工具评估为营养风险阳性。\n2.营养治疗是指通过膳食、肠内或肠外途径为患者提供能量和营养素，以达到调整\n机体代谢、改善营养状况、增强抵抗力、促进康复和痊愈等目的。营养治疗遵循个体化\n动态调整原则，根据不同疾病或代谢状态，确定患者每日能量、营养素的供给量和比例，\n并按照标准操作规程进行配制送至病区。", "category": "临床营养专业医疗质量控制指标（2022年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 322, "full_text": "存在营养风险住院患者营养治疗率\n定义：经营养风险筛查，存在营养风险并接受营养治疗的住院患者数占同期存在营\n养风险住院患者总数的比例。\n计算公式：存在营养风险住院 存在营养风险并接受营养治疗的住院患者数\n= ×100%\n患者营养治疗率 同期存在营养风险住院患者总数\n意义：反映医疗机构营养治疗覆盖率及规范开展情况。\n说明：1.存在营养风险指使用经验证的 ors": [], "id": 335, "full_text": "术中主动保温率\n定义：单位时间内，手术麻醉期间采取主动保温措施（全程连续主动保温或间断主\n动保温）全麻例次数占同期全麻总例次数的比例。\n计算公式：单位时间内手术麻醉期间\n采取主动保温措施全麻例次数\n术中主动保温率= ×100%\n同期全麻\n总例次数\n意义：术中主动保温有助于降低手术麻醉期间低体温发生率，可以显著改善患者预后。\n说明：主动保温措施包括：使用充气升温装置等加温设备进行体温保护；使用输血\n输液加温装置加温至37℃后再输注。"}, {"name": "术中自体血输注率", "code": "AQI-ATR-09", "definition": "单位时间内，手术麻醉中接受自体血（包括自体全血及自体血红细胞）输注\n患者数占同期麻醉中接受输血治疗患者总数的比例。", "formula": "单位时间内手术麻醉中接受自体血输注患者数\n术中自体血输注率= ×100%\n同期麻醉中接受输血治疗患者总数", "significance": "反映医疗机构医疗质量。", "notes": "", "category": "麻醉专业医疗质量控制指标（2022年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 336, "full_text": "术中自体血输注率\n定义：单位时间内，手术麻醉中接受自体血（包括自体全血及自体血红细胞）输注\n患者数占同期麻醉中接受输血治疗患者总数的比例。\n计算公式：单位时间内手术麻醉中接受自体血输注患者数\n术中自体血输注率= ×100%\n同期麻醉中接受输血治疗患者总数\n意义：反映医疗机构医疗质量。"}, {"name": "手术麻醉期间低体温发生率", "code": "AQI-IHT-10", "definition": "单位时间内，手术麻醉期间低体温患者数（医疗目的的控制性降温除外）占\n同期接受体温监测的麻醉患者总数的比例。", "formula": "单位时间内手术麻醉期间低体温患者数\n（医疗目的的控制性降温除外）\n手术麻醉期间低体温发生率= ×100%\n同期接受体温监测的\n麻醉患者总数", "significance": "反映医疗机构麻醉质量。", "notes": "手术麻醉期间低体温是指患者进入手术间开始至患者自手术间或麻醉后监测\n治疗室（PACU）返回病房前核心体温低于36℃（连续监测低体温持续≥30分钟或间断\n监测连续两次低体温且间隔时间≥30分钟）。", "category": "麻醉专业医疗质量控制指标（2022年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 337, "full_text": "手术麻醉期间低体温发生率\n定义：单位时间内，手术麻醉期间低体温患者数（医疗目的的控制性降温除外）占\n同期接受体温监测的麻醉患者总数的比例。\n计算公式：单位时间内手术麻醉期间低体温患者数\n（医疗目的的控制性降温除外）\n手术麻醉期间低体温发生率= ×100%\n同期接受体温监测的\n麻醉患者总数\n意义：反映医疗机构麻醉质量。\n说明：手术麻醉期间低体温是指患者进入手术间开始至患者自手术间或麻醉后监测\n治疗室（PACU）返回病房前核心体温低于36℃（连续监测低体温持续≥30分钟或间断\n监测连续两次低体温且间隔时间≥30分钟）。"}, {"name": "术中牙齿损伤发生率", "code": "AQI-IDI-11", "definition": "单位时间内，发生术中牙齿损伤的例次数占同期插管全身麻醉总例次数的比例。", "formula": "单位时间内发生术中牙齿损伤的例次数\n术中牙齿损伤发生率= ×1000‰\n同期插管全身麻醉总例次数", "significance": "术中牙齿损伤是与麻醉医生密切相关的重要并发症，应当予以密切关注。", "notes": "术中牙齿损伤是指患者从麻醉开始至麻醉结束过程中发生的牙齿损伤（包括\n牙齿脱落、松动等）。气管内导管全麻及喉罩全麻均属于插管全身麻醉。", "category": "麻醉专业医疗质量控制指标（2022年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 338, "full_text": "术中牙齿损伤发生率\n定义：单位时间内，发生术中牙齿损伤的例次数占同期插管全身麻醉总例次数的比例。\n计算公式：单位时间内发生术中牙齿损伤的例次数\n术中牙齿损伤发生率= ×1000‰\n同期插管全身麻醉总例次数\n意义：术中牙齿损伤是与麻醉医生密切相关的重要并发症，应当予以密切关注。\n说明：术中牙齿损伤是指患者从麻醉开始至麻醉结束过程中发生的牙齿损伤（包括\n牙齿脱落、松动等）。气管内导管全麻及喉罩全麻均属于插管全身麻醉。"}, {"name": "麻醉期间严重反流误吸发生率", "code": "AQI-IRA-12", "definition": "单位时间内，麻醉期间严重反流误吸发生例次数占同期麻醉科完成麻醉总例\n次数的比例。", "formula": "麻醉期间严重反流 单位时间内麻醉期间严重反流误吸发生例次数\n= ×10000‱\n误吸发生率 同期麻醉科完成麻醉总例次数", "significance": "反映医疗机构麻醉质量。", "notes": "麻醉期间严重反流误吸是指麻醉期间发生的且在患者离开手术室/恢复室时\n呼吸空气指氧饱和度无法维持≥90%的反流误吸。", "category": "麻醉专业医疗质量控制指标（2022年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 339, "full_text": "麻醉期间严重反流误吸发生率\n定义：单位时间内，麻醉期间严重反流误吸发生例次数占同期麻醉科完成麻醉总例\n次数的比例。\n计算公式：麻醉期间严重反流 单位时间内麻醉期间严重反流误吸发生例次数\n= ×10000‱\n误吸发生率 同期麻醉科完成麻醉总例次数\n意义：反映医疗机构麻醉质量。\n说明：麻醉期间严重反流误吸是指麻醉期间发生的且在患者离开手术室/恢复室时\n呼吸空气指氧饱和度无法维持≥90%的反流误吸。"}, {"name": "计划外建立人工气道发生率", "code": "AQI-IUA-13", "definition": "单位时间内，计划外建立人工气道的麻醉科患者数占同期麻醉科患者总数的\n比例。", "formula": "计划外建立 单位时间内计划外建立人工气道的麻醉科患者数\n= ×1000‰\n人工气道发发生率 同期麻醉科患者总数", "significance": "反映医疗机构麻醉质量管理和（或）手术质量。", "notes": "计划外建立人工气道是指患者进入手术室后直至离开手术室前，因呼吸骤停或\n严重呼吸抑制等而进行的人工气道的建立，包括气管插管、喉罩置入和紧急气管造口术。", "category": "麻醉专业医疗质量控制指标（2022年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 340, "full_text": "计划外建立人工气道发生率\n定义：单位时间内，计划外建立人工气道的麻醉科患者数占同期麻醉科患者总数的\n比例。\n计算公式：计划外建立 单位时间内计划外建立人工气道的麻醉科患者数\n= ×1000‰\n人工气道发发生率 同期麻醉科患者总数\n意义：反映医疗机构麻醉质量管理和（或）手术质量。\n说明：计划外建立人工气道是指患者进入手术室后直至离开手术室前，因呼吸骤停或\n严重呼吸抑制等而进行的人工气道的建立，包括气管插管、喉罩置入和紧急气管造口术。"}, {"name": "术中心脏骤停率", "code": "AQI-ICA-14", "definition": "单位时间内，术中心脏骤停患者数占同期麻醉科患者总数的比例。", "formula": "单位时间内术中心脏骤停患者数\n术中心脏骤停率= ×10000‱\n同期麻醉科患者总数", "significance": "反映医疗机构医疗质量。", "notes": "术中心脏骤停是指麻醉开始后至患者离开手术室前非医疗目的的心脏突然停\n止跳动，不包括患者麻醉开始前发生的心脏骤停。", "category": "麻醉专业医疗质量控制指标（2022年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 341, "full_text": "术中心脏骤停率\n定义：单位时间内，术中心脏骤停患者数占同期麻醉科患者总数的比例。\n计算公式：单位时间内术中心脏骤停患者数\n术中心脏骤停率= ×10000‱\n同期麻醉科患者总数\n意义：反映医疗机构医疗质量。\n说明：术中心脏骤停是指麻醉开始后至患者离开手术室前非医疗目的的心脏突然停\n止跳动，不包括患者麻醉开始前发生的心脏骤停。"}, {"name": "麻醉期间严重过敏反应发生率", "code": "AQ ": "使用一线药物进行治疗的PHN初诊患者数占同期PHN初诊患者总数的比例。", "formula": "使用一线药物进行治疗的PHN初诊患者数\nPHN初诊患者一线药物使用率= ×100%\n同期PHN初诊患者总数", "significance": "反映医疗机构对PHN患者诊疗的规范性。", "notes": "1.本指标中带状疱疹后神经痛（PHN）是指患急性带状疱疹皮疹愈合30天后\n仍遗留有累及区域的疼痛，国家临床版2.0疾病诊断编码（4位编码）为B02.2（下同）。\n2.本指标中初诊是指患者在医疗机构首次被诊断为带状疱疹后神经痛。\n3.本指标中PHN一线治疗药物是指按照《周围神经病理性疼痛诊疗中国专家共识》\n《带状疱疹相关性疼痛全程管理专家共识》等国内外相关的规范、指南及专家共识，推荐\n作为PHN治疗首选的药物种类，如钙离子通道调节剂、钠离子通道阻断剂和抗抑郁药等。", "category": "疼痛专业医疗质量控制指标（2023年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 487, "full_text": "\u0007带状疱疹后神经痛（PHN）初诊患者一线药物使用率（PM-\n定义：使用一线药物进行治疗的PHN初诊患者数占同期PHN初诊患者总数的比例。\n计算公式：使用一线药物进行治疗的PHN初诊患者数\nPHN初诊患者一线药物使用率= ×100%\n同期PHN初诊患者总数\n意义：反映医疗机构对PHN患者诊疗的规范性。\n说明：1.本指标中带状疱疹后神经痛（PHN）是指患急性带状疱疹皮疹愈合30天后\n仍遗留有累及区域的疼痛，国家临床版2.0疾病诊断编码（4位编码）为B02.2（下同）。\n2.本指标中初诊是指患者在医疗机构首次被诊断为带状疱疹后神经痛。\n3.本指标中PHN一线治疗药物是指按照《周围神经病理性疼痛诊疗中国专家共识》\n《带状疱疹相关性疼痛全程管理专家共识》等国内外相关的规范、指南及专家共识，推荐\n作为PHN治疗首选的药物种类，如钙离子通道调节剂、钠离子通道阻断剂和抗抑郁药等。"}, {"name": "PHN治疗有效率", "code": "PM-PHN-02", "definition": "治疗后有效缓解的PHN患者例数占同期治疗的PHN患者总例数的比例。", "formula": "治疗后有效缓解的PHN患者例数\nPHN治疗有效率= ×100%\n同期治疗的PHN患者总例数", "significance": "反映医疗机构对PHN患者的诊疗质量。", "notes": "1.PHN治疗分为非手术治疗和手术治疗，分别统计其有效率。\n2.本指标中手术治疗包括：脊髓神经根射频消融术（04.2x05）、三叉神经射频消融术\n（04.2x07）、三叉神经半月节射频热凝术（04.2x08）、肋间神经射频消融术（04.2x11）等\n颅和周围神经破坏术（04.2x），脊髓神经刺激器导线置入或置换（03.9300）、周围神经刺\n激器导线置入或置换（04.9200）、完全可植入型的输注泵置入（86.0600）、输注泵置入术\n（86.0601）；非手术治疗是指除上述手术治疗外的其他治疗。（下同）\n3.本指标中治疗有效缓解是指PHN患者住院治疗1周后，使用VAS或NRS对治疗\n的效果进行评价，疼痛评分较基线降低≥30%。", "category": "疼痛专业医疗质量控制指标（2023年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 488, "full_text": "PHN治疗有效率\n定义：治疗后有效缓解的PHN患者例数占同期治疗的PHN患者总例数的比例。\n计算公式：治疗后有效缓解的PHN患者例数\nPHN治疗有效率= ×100%\n同期治疗的PHN患者总例数\n意义：反映医疗机构对PHN患者的诊疗质量。\n说明：1.PHN治疗分为非手术治疗和手术治疗，分别统计其有效率。\n2.本指标中手术治疗包括：脊髓神经根射频消融术（04.2x05）、三叉神经射频消融术\n（04.2x07）、三叉神经半月节射频热凝术（04.2x08）、肋间神经射频消融术（04.2x11）等\n颅和周围神经破坏术（04.2x），脊髓神经刺激器导线置入或置换（03.9300）、周围神经刺\n激器导线置入或置换（04.9200）、完全可植入型的输注泵置入（86.0600）、输注泵置入术\n（86.0601）；非手术治疗是指除上述手术治疗外的其他治疗。（下同）\n3.本指标中治疗有效缓解是指PHN患者住院治疗1周后，使用VAS或NRS对治疗\n的效果进行评价，疼痛评分较基线降低≥30%。"}, {"name": "PHN患者手术并发症发生率", "code": "PM-PHN-03", "definition": "PHN患者行手术治疗发生并发症的例数占同期PHN患者手术治疗总例数的\n比例。", "formula": "PHN患者行手术治疗发生并发症的例数\nPHN患者手术并发症发生率= ×100%\n同期PHN患者手术治疗总例数", "significance": "反映医疗机构手术治疗PHN的安全性。", "notes": "本指标中手术并发症是指出现的与手术相关的感染、出血、气胸、神经功能\n障碍、器官组织损伤、全脊髓麻醉。", "category": "疼痛专业医疗质量控制指标（2023年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 489, "full_text": "PHN患者手术并发症发生率\n定义：PHN患者行手术治疗发生并发症的例数占同期PHN患者手术治疗总例数的\n比例。\n计算公式：PHN患者行手术治疗发生并发症的例数\nPHN患者手术并发症发生率= ×100%\n同期PHN患者手术治疗总例数\n意义：反映医疗机构手术治疗PHN的安全性。\n说明：本指标中手术并发症是指出现的与手术相关的感染、出血、气胸、神经功能\n障碍、器官组织损伤、全脊髓麻醉。"}, {"name": "PHN患者精神心理评估率", "code": "PM-PHN-04", "definition": "进行精神心理评估的PHN患者例数占同期PHN的患者总例数的比例。", "formula": "进行精神心理评估的PHN患者例数\nPHN患者精神心理评估率= ×100%\n同期诊断为PHN的患者总例数", "significance": "反映医疗机构对PHN患者诊疗的全面性。", "notes": "本指标中精神心理评估是指采用焦虑筛查量表（GAD-7）、抑郁筛查量表\n（PHQ-9）或其他的测试量表，对PHN患者的精神心理状态进行评估。", "category": "疼痛专业医疗质量控制指标（2023年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 490, "full_text": "PHN患者精神心理评估率\n定义：进行精神心理评估的PHN患者例数占同期PHN的患者总例数的比例。\n计算公式：进行精神心理评估的PHN患者例数\nPHN患者精神心理评估率= ×100%\n同期诊断为PHN的患者总例数\n意义：反映医疗机构对PHN患者诊疗的全面性。\n说明：本指标中精神心理评估是指采用焦虑筛查量表（GAD-7）、抑郁筛查量表\n（PHQ-9）或其他的测试量表，对PHN患者的精神心理状态进行评估。"}, {"name": "癌症疼痛患者24h内疼痛全面评估完成率", "code": "PM-CP-01", "definition": "入院24小时内完成疼痛全面评估的癌症疼痛患者例数占同期癌症疼痛住院\n患者总例数的比例。", "formula": "癌症疼痛患者24 h内 入院24h内完成疼痛全面评估的癌症疼痛患者例数\n= ×100%\n疼痛全面评估完成率 同期癌症疼痛住院患者总例数", "significance": "反映医疗机构对癌症疼痛患者评估的规范性。", "notes": "1.本指标中癌症疼痛的国家临床版2.0疾病诊断编码（4位编码）包括：\nR52.1、R52.2、R52.9（下同）。\n2.本指标中疼痛全面评估是指使用简明疼痛评估量表（BPI）等方法对患者的疼痛\n程度、性质、部位等方面进行全面评估。", "category": "疼痛专业医疗质量控制指标（2023年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 491, "full_text": "癌症疼痛患者24h内疼痛全面评估完成率\n定义：入院24小时内完成疼痛全面评估的癌症疼痛患者例数占同期癌症疼痛住院\n患者总例数的比例。\n计算公式：癌症疼痛患者24 h内 入院24h内完成疼痛全面评估的癌症疼痛患者例数\n= ×100%\n疼痛全面评估完成率 同期癌症疼痛住院患者总例数\n意义：反映医疗机构对癌症疼痛患者评估的规范性。\n说明：1.本指标中癌症疼痛的国家临床版2.0疾病诊断编码（4位编码）包括：\nR52.1、R52.2、R52.9（下同）。\n2.本指标中疼痛全面评估是指使用简明疼痛评估量表（BPI）等方法对患者的疼痛\n程度、性质、部位等方面进行全面评估。"}, {"name": "中重度癌症疼痛患者阿片类药物使用率", "code": "PM-CP-02", "definition": "使用阿片类药物治疗中重度疼痛的癌症患者例数占同期中重度疼痛的癌症患\n者总例数的比例。", "formula": "中重度癌症疼痛患者 使用阿片类药物治疗中重度疼痛的癌症患者例数\n= ×100%\n阿片类药物使用率 同期中重度疼痛的癌症患者总例数", "significance": "反映医疗机构对癌症疼痛患者治疗的规范性。", "notes": "本指标中中重度疼痛的癌症患者是指使用VAS或NRS评分≥4分的癌症疼\n痛患者。（下同）", "category": "疼痛专业医疗质量控制指标（2023年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 492, "full_text": "中重度癌症疼痛患者阿片类药物使用率\n定义：使用阿片类药物治疗中重度疼痛的癌症患者例数占同期中重度疼痛的癌症患\n者总例数的比例。\n计算公式：中重度癌症疼痛患者 使用阿片类药物治疗中重度疼痛的癌症患者例数\n= ×100%\n阿片类药物使用率 同期中重度疼痛的癌症患者总例数\n意义：反映医疗机构对癌症疼痛患者治疗的规范性。\n说明：本指标中中重度疼痛的癌症患者是指使用VAS或NRS评分≥4分的癌症疼\n痛患者。（下同）"}, {"name": "癌症疼痛治疗有效率", "code": "PM-CP-03", "definition": "治疗后有效缓解的癌症疼痛患者例数占同期治疗的癌症疼痛患者总例数的\n比例。", "formula": "治疗后有效缓解的癌症疼痛患者例数\n癌症疼痛治疗有效率= ×100%\n同期治疗的癌症疼痛患者总例数", "significance": "反映医疗机构对癌症疼痛患者的诊疗质量。", "notes": "1.癌症疼痛治疗分为非手术治疗和手术治疗，分别统计其有效率。\n2.本指标中手术治疗包括：脊髓神经根射频消融术（04.2x05）、三叉神经射频消融术\n（04.2x07）、三叉神经半月节射频热凝术（04.2x08）、肋间神经射频消融术（04.2x11）等\n颅和周围神经的破坏术（04.2x），脊髓神经刺激器导线置入或置换（03.9300）、周围神经\n刺激器导线置入或置换（04.9200）、完全可植入型的输注泵置入（86.0600）、输注泵置入\n术（86.0601）；非手术治疗是指除上述手术治疗外的其他治疗。（下同）\n3.本指标中有效缓解是指治疗后效果满足以下条件之一：①持续性疼痛数字化评分\n降低到3分以下；②持续性疼痛数字化评分降低50%以上；③止痛药物剂量减少50%\n以上；④爆发痛减少到3次/天以下；⑤功能改善（包括运动功能、消化功能改善）", "category": "疼痛专业医疗质量控制指标（2023年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 493, "full_text": "癌症疼痛治疗有效率\n定义：治疗后有效缓解的癌症疼痛患者例数占同期治疗的癌症疼痛患者总例数的\n比例。\n计算公式：治疗后有效缓解的癌症疼痛患者例数\n癌症疼痛治疗有效率= ×100%\n同期治疗的癌症疼痛患者总例数\n意义：反映医疗机构对癌症疼痛患者的诊疗质量。\n说明：1.癌症疼痛治疗分为非手术治疗和手术治疗，分别统计其有效率。\n2.本指标中手术治疗包括：脊髓神经根射频消融术（04.2x05）、三叉神经射频消融术\n（04.2x07）、三叉神经半月节射频热凝术（04.2x08）、肋间神经射频消融术（04.2x11）等\n颅和周围神经的破坏术（04.2x），脊髓神经刺激器导线置入或置换（03.9300）、周围神经\n刺激器导线置入或置换（04.9200）、完全可植入型的输注泵置入（86.0600）、输注泵置入\n术（86.0601）；非手术治疗是指除上述手术治疗外的其他治疗。（下同）\n3.本指标中有效缓解是指治疗后效果满足以下条件之一：①持续性疼痛数字化评分\n降低到3分以下；②持续性疼痛数字化评分降低50%以上；③止痛药物剂量减少50%\n以上；④爆发痛减少到3次/天以下；⑤功能改善（包括运动功能、消化功能改善）"}, {"name": "癌症疼痛患者术后院内死亡率", "code": "PM-CP-04", "definition": "行手术治疗的癌症疼痛患者术后住院期间全因死亡人数占同期行手术 CU患者实际病死率与同期ICU患者预计病死率的比值。", "formula": "ICU 患者实际病死率\nICU患者标化病死指数=\n同期 ICU 患者预计病死率\nICU 患者死亡危险性总和\nICU 患者预计病死率=\n同期 ICU 收治患者总数", "significance": "反映ICU整体诊疗水平。", "notes": "1.本指标中ICU死亡患者包括因不可逆疾病而自动出院的患者，不包括入院\n时已脑死亡，因器官捐献而收治ICU的患者。\n2. ICU患者死亡危险性（R）的计算规则：In（R/1-R）=-3.517+（APACHEⅡ评\n分×0.146）+患者入ICU的主要疾病得分（按国际标准）+0.603（ 仅限于急诊手术后患\n者）；ICU患者死亡危险性总和为同期所有ICU患者死亡危险性的和。", "category": "重症医学专业医疗质量控制指标（2024年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 583, "full_text": "ICU患者标化病死指数\n定义：ICU患者实际病死率与同期ICU患者预计病死率的比值。\n计算公式：ICU 患者实际病死率\nICU患者标化病死指数=\n同期 ICU 患者预计病死率\nICU 患者死亡危险性总和\nICU 患者预计病死率=\n同期 ICU 收治患者总数\n意义：反映ICU整体诊疗水平。\n说明：1.本指标中ICU死亡患者包括因不可逆疾病而自动出院的患者，不包括入院\n时已脑死亡，因器官捐献而收治ICU的患者。\n2. ICU患者死亡危险性（R）的计算规则：In（R/1-R）=-3.517+（APACHEⅡ评\n分×0.146）+患者入ICU的主要疾病得分（按国际标准）+0.603（ 仅限于急诊手术后患\n者）；ICU患者死亡危险性总和为同期所有ICU患者死亡危险性的和。"}, {"name": "ICU非计划气管插管拔管率ICU-12）", "code": "", "definition": "ICU患者非计划气管插管拔管例数占同期ICU患者气管插管拔管总例数的比例。", "formula": "ICU 患者非计划气管插管拔管例数\nICU 非计划气管插管拔管率= ×100%\n同期 ICU 患者气管插管拔管总例数", "significance": "反映ICU的管理水平。", "notes": "", "category": "重症医学专业医疗质量控制指标（2024年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 584, "full_text": "ICU非计划气管插管拔管率ICU-12）\n定义：ICU患者非计划气管插管拔管例数占同期ICU患者气管插管拔管总例数的比例。\n计算公式：ICU 患者非计划气管插管拔管例数\nICU 非计划气管插管拔管率= ×100%\n同期 ICU 患者气管插管拔管总例数\n意义：反映ICU的管理水平。"}, {"name": "ICU气管插管拔管后48h再插管率", "code": "ICU-13", "definition": "ICU患者气管插管拔管后48h内再插管例数占同期ICU患者气管插管拔管总\n例数的比例。", "formula": "ICU 气管插管 ICU 患者气管插管拔管后48h内再插管例数\n= ×100%\n拔后 48h 再插管率 同期 ICU 患者气管插管拔管总例数", "significance": "反映对ICU患者脱机拔管指征的把握能力。", "notes": "本指标中气管插管拔管不包括非计划气管插管拔管。", "category": "重症医学专业医疗质量控制指标（2024年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 585, "full_text": "ICU气管插管拔管后48h再插管率\n定义：ICU患者气管插管拔管后48h内再插管例数占同期ICU患者气管插管拔管总\n例数的比例。\n计算公式：ICU 气管插管 ICU 患者气管插管拔管后48h内再插管例数\n= ×100%\n拔后 48h 再插管率 同期 ICU 患者气管插管拔管总例数\n意义：反映对ICU患者脱机拔管指征的把握能力。\n说明：本指标中气管插管拔管不包括非计划气管插管拔管。"}, {"name": "非计划转入ICU率ICU-14）", "code": "", "definition": "非计划转入ICU的手术患者人数占同期转入ICU的手术患者总人数的比例。", "formula": "非计划转入 ICU 的手术患者人数\n非计划转入ICU率= ×100%\n同期转入 ICU 的手术患者总人数", "significance": "反映医疗机构医疗质量的重要结果指标之一。", "notes": "本指标中非计划转入ICU是指非早期预警转入，或在开始麻醉诱导前并无术\n后转入ICU的计划，而在术中或术后决定转入ICU。", "category": "重症医学专业医疗质量控制指标（2024年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 586, "full_text": "非计划转入ICU率ICU-14）\n定义：非计划转入ICU的手术患者人数占同期转入ICU的手术患者总人数的比例。\n计算公式：非计划转入 ICU 的手术患者人数\n非计划转入ICU率= ×100%\n同期转入 ICU 的手术患者总人数\n意义：反映医疗机构医疗质量的重要结果指标之一。\n说明：本指标中非计划转入ICU是指非早期预警转入，或在开始麻醉诱导前并无术\n后转入ICU的计划，而在术中或术后决定转入ICU。"}, {"name": "转出ICU后48h内重返率ICU-15）", "code": "", "definition": "转出ICU后48h内重返ICU的患者人数占同期转出ICU的患者总人数的比例。", "formula": "转出 ICU 后 48h 内重返 ICU 的患者人数\n转出 ICU 后 48h 内重返率= ×100%\n同期转出 ICU 的患者总人数", "significance": "反映对ICU患者转出ICU指征的把握能力。", "notes": "", "category": "重症医学专业医疗质量控制指标（2024年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 587, "full_text": "转出ICU后48h内重返率ICU-15）\n定义：转出ICU后48h内重返ICU的患者人数占同期转出ICU的患者总人数的比例。\n计算公式：转出 ICU 后 48h 内重返 ICU 的患者人数\n转出 ICU 后 48h 内重返率= ×100%\n同期转出 ICU 的患者总人数\n意义：反映对ICU患者转出ICU指征的把握能力。"}, {"name": "ICU呼吸机相关肺炎（VAP）发病率ICU-16）", "code": "", "definition": "ICU患者每1000个有创呼吸机使用天数中新发生相关肺炎的频次。", "formula": "ICU 相关肺炎新发病例例次数\nICU 呼吸机相关肺炎发病率= ×1000‰\n同期 ICU 患者有创呼吸机累计使用天数", "significance": "反映ICU感控、有创机械通气及管理能力。", "notes": "本指标中呼吸机相关肺炎是指ICU患者在使用有创呼吸机期间或停止使用有\n创呼吸机48小时内发生的肺部感染。", "category": "重症医学专业医疗质量控制指标（2024年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 588, "full_text": "ICU呼吸机相关肺炎（VAP）发病率ICU-16）\n定义：ICU患者每1000个有创呼吸机使用天数中新发生相关肺炎的频次。\n计算公式：ICU 相关肺炎新发病例例次数\nICU 呼吸机相关肺炎发病率= ×1000‰\n同期 ICU 患者有创呼吸机累计使用天数\n意义：反映ICU感控、有创机械通气及管理能力。\n说明：本指标中呼吸机相关肺炎是指ICU患者在使用有创呼吸机期间或停止使用有\n创呼吸机48小时内发生的肺部感染。"}, {"name": "ICU血管导管相关血流感染（CRBSI）发病率", "code": "ICU-17", "definition": "ICU患者每1000个血管导管使用天数中新发生相关血流感染的频次。", "formula": "ICU 相关血流感染新发病例例次数\nICU 血管导管相关血流感染发病率= ×1000‰\n同期 ICU 患者血管导管累计使用天数", "significance": "反映ICU感控、血管内导管留置及管理能力。", "notes": "1.本指标中血管导管包括中心静脉导管（CVC）、经外周置入中心静脉导管\n（PICC）、输液港（PORT）、脐静脉导管。\n2.本指标中相关 数\n= ×100%\n营养启动率 同期入住 ICU 超过 48h 的患者总人数\n意义：反映营养治疗的规范性和对肠内营养启动指征的把握能力。\n说明：患者EN启动前应排除EN禁忌证，参考《中国成人患者肠外肠内营养临床\n应用指南（2023版）》。"}, {"name": "医师人数与药师人数之比", "code": "PHA-01", "definition": "医院注册医师总人数与医院药师总人数之比。", "formula": "医院注册医师总人数\n医师人数与药师人数之比=\n医院药师总人数", "significance": "反映医院药学专业人力资源配置情况。", "notes": "1.医院注册医师总人数是指国家医师电子化注册系统显示已激活状态并承担\n相关岗位任务的在岗（助理）医师总人数，以主要执业机构进行统计。\n2.医院药师总人数是指按照有关规定取得药学专业任职资格（主任药师、副主任药\n师、主管药师、药师、药士），并承担药学相关岗位任务的在岗人员。在岗人员包括在\n编及合同制人员、派遣人员、返聘和临聘本单位半年以上人员，不包括离退休人员、退\n职人员、离开本单位仍保留劳动关系人员、返聘和临聘不足半年人员。", "category": "药事管理专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 592, "full_text": "医师人数与药师人数之比\n定义：医院注册医师总人数与医院药师总人数之比。\n计算公式：医院注册医师总人数\n医师人数与药师人数之比=\n医院药师总人数\n意义：反映医院药学专业人力资源配置情况。\n说明：1.医院注册医师总人数是指国家医师电子化注册系统显示已激活状态并承担\n相关岗位任务的在岗（助理）医师总人数，以主要执业机构进行统计。\n2.医院药师总人数是指按照有关规定取得药学专业任职资格（主任药师、副主任药\n师、主管药师、药师、药士），并承担药学相关岗位任务的在岗人员。在岗人员包括在\n编及合同制人员、派遣人员、返聘和临聘本单位半年以上人员，不包括离退休人员、退\n职人员、离开本单位仍保留劳动关系人员、返聘和临聘不足半年人员。"}, {"name": "每百张床位临床药师人数", "code": "PHA-02", "definition": "每 100 张实际开放床位配备的临床药师人数。", "formula": "临床药师人数\n每百张床位临床药师人数= ×100\n同期实际开放床位数", "significance": "反映医院临床药师配备情况。", "notes": "1.临床药师是指经过临床药学专业培训，直接参与临床药物治疗管理（包\n括审核所在科室的用药医嘱；参加联合查房与会诊，与医师共同优化药物治疗方案；\n开展药学监护和药物重整；为患者提供用药咨询和用药教育；开展患者出院带药指\n导；其他药学服务工作等），促进药物合理应用和保护患者用药安全的药学专业技术\n人员。\n2.实际开放床位数即实有床位数，指统计周期内固定实有床位（非编制床位），包\n括正规床、简易床、监护床、超过半年加床、正在消毒和修理的床位、因扩建或大修而\n停用的床位。不包括产科新生儿床、接产室待产床、库存床、观察床、临时加床和病人\n家属陪侍床。", "category": "药事管理专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 593, "full_text": "每百张床位临床药师人数\n定义：每 100 张实际开放床位配备的临床药师人数。\n计算公式：临床药师人数\n每百张床位临床药师人数= ×100\n同期实际开放床位数\n意义：反映医院临床药师配备情况。\n说明：1.临床药师是指经过临床药学专业培训，直接参与临床药物治疗管理（包\n括审核所在科室的用药医嘱；参加联合查房与会诊，与医师共同优化药物治疗方案；\n开展药学监护和药物重整；为患者提供用药咨询和用药教育；开展患者出院带药指\n导；其他药学服务工作等），促进药物合理应用和保护患者用药安全的药学专业技术\n人员。\n2.实际开放床位数即实有床位数，指统计周期内固定实有床位（非编制床位），包\n括正规床、简易床、监护床、超过半年加床、正在消毒和修理的床位、因扩建或大修而\n停用的床位。不包括产科新生儿床、接产室待产床、库存床、观察床、临时加床和病人\n家属陪侍床。"}, {"name": "处方审核率", "code": "PHA-03", "definition": "药品收费前药师审核的处方数占同期处方总数的比例。", "formula": "药品收费前药师审核门诊处方数\n门诊处方审核率= ×100%\n同期门诊处方总数\n药品收费前药师审核急诊处方数\n急诊处方审核率= ×100%\n同期急诊处方总数\n药品收费前药师审核住院患者用药医嘱条目数\n住院患者用药医嘱审核率= ×100%\n同期住院患者用药医嘱总条目数", "significance": "反映医院药师对处方审核职责的落实情况。", "notes": "1.审核的处方包括纸质处方、电子处方和医疗机构病区用药医嘱单。\n2.处方审核方式包括人工审核、合理用药软件初审结合人工复核方式。\n3.为便于统计，住院患者的有关数据均通过调查时间范围内出院患者的数据计算，\n下同。", "category": "药事管理专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 594, "full_text": "处方审核率\n定义：药品收费前药师审核的处方数占同期处方总数的比例。\n计算公式：药品收费前药师审核门诊处方数\n门诊处方审核率= ×100%\n同期门诊处方总数\n药品收费前药师审核急诊处方数\n急诊处方审核率= ×100%\n同期急诊处方总数\n药品收费前药师审核住院患者用药医嘱条目数\n住院患者用药医嘱审核率= ×100%\n同期住院患者用药医嘱总条目数\n意义：反映医院药师对处方审核职责的落实情况。\n说明：1.审核的处方包括纸质处方、电子处方和医疗机构病区用药医嘱单。\n2.处方审核方式包括人工审核、合理用药软件初审结合人工复核方式。\n3.为便于统计，住院患者的有关数据均通过调查时间范围内出院患者的数据计算，\n下同。"}, {"name": "处方点评情况（PHA-\u000704）", "code": "", "definition": "实施点评的处方数占同期处方总数的比例。", "formula": "实施点评的门诊处方数\n门诊处方点评率= ×100%\n同期门诊处方总数\n实施点评的急诊处方数\n急诊处方点评率= ×100%\n同期急诊处方总数\n实施点评的出院病历数\n住院患者用药医嘱点评率= ×100%\n同期出院病历总数\n实施点评的使用重点监控\n合理用药药品的出院病历数\n重点监控合理用药药品住院\n= ×100%\n同期使用重点监控合理用药\n患者用药医嘱点评率\n药品的出院病历总数", "significance": "反映医院实施处方点评工作的情况。\n（二）处方合理率（PHA-04-02）", "notes": "1.依据《医院处方点评管理规范（试行）》，医院药学部门应当会同医疗管理\n部门，根据医院诊疗科目、科室设置、技术水平、诊疗量等实际情况，确定具体抽样方\n法和抽样率，其中门急诊处方的抽样率不应少于总处方量的1‰，且每月点评处方绝对\n数不应少于100张；病房（区）医嘱单的抽样率（按出院病历数计）不应少于1%，且每\n月点评出院病历绝对数不应少于30份；同期点评的病历应覆盖各省重点监控合理用药药\n品目录内的全部药品品种。\n2.重点监控合理用药药品是指国家或省级卫生健康行政部门公布的在监控期内的重\n点监控合理用药药品目录内品种，下同。", "category": "药事管理专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 595, "full_text": "处方点评情况（PHA-\u000704）\n定义：实施点评的处方数占同期处方总数的比例。\n计算公式：实施点评的门诊处方数\n门诊处方点评率= ×100%\n同期门诊处方总数\n实施点评的急诊处方数\n急诊处方点评率= ×100%\n同期急诊处方总数\n实施点评的出院病历数\n住院患者用药医嘱点评率= ×100%\n同期出院病历总数\n实施点评的使用重点监控\n合理用药药品的出院病历数\n重点监控合理用药药品住院\n= ×100%\n同期使用重点监控合理用药\n患者用药医嘱点评率\n药品的出院病历总数\n意义：反映医院实施处方点评工作的情况。\n（二）处方合理率（PHA-04-02）\n说明：1.依据《医院处方点评管理规范（试行）》，医院药学部门应当会同医疗管理\n部门，根据医院诊疗科目、科室设置、技术水平、诊疗量等实际情况，确定具体抽样方\n法和抽样率，其中门急诊处方的抽样率不应少于总处方量的1‰，且每月点评处方绝对\n数不应少于100张；病房（区）医嘱单的抽样率（按出院病历数计）不应少于1%，且每\n月点评出院病历绝对数不应少于30份；同期点评的病历应覆盖各省重点监控合理用药药\n品目录内的全部药品品种。\n2.重点监控合理用药药品是指国家或省级卫生健康行政部门公布的在监控期内的重\n点监控合理用药药品目录内品种，下同。"}, {"name": "住院患者药学监护率", "code": "PHA-05", "definition": "实施药学监护的住院患者人次数占同期住院患者总人次数的比例。", "formula": "实施药学监护的住院患者人次数\n住院患者药学监护率= ×100%\n同期住院患者总人次数", "significance": "反映临床药师为住院患者提供药学服务的情况。", "notes": "1.药学监护主要内容包括药学查房、制订监护计划、患者用药教育、药学会\n诊、血药浓度监测等。本指标统计本医疗机构实施药学监护（需有药学监护记录）的住\n院患者人次数。\n2.同一住院患者一次住院期间接受药学监护计为1人次数。", "category": "药事管理专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 596, "full_text": "住院患者药学监护率\n定义：实施药学监护的住院患者人次数占同期住院患者总人次数的比例。\n计算公式：实施药学监护的住院患者人次数\n住院患者药学监护率= ×100%\n同期住院患者总人次数\n意义：反映临床药师为住院患者提供药学服务的情况。\n说明：1.药学监护主要内容包括药学查房、制订监护计划、患者用药教育、药学会\n诊、血药浓度监测等。本指标统计本医疗机构实施药学监护（需有药学监护记录）的住\n院患者人次数。\n2.同一住院患者一次住院期间接受药学监护计为1人次数。"}, {"name": "住院患者静脉用药情况", "code": "PHA-06", "definition": "使用静脉输液的住院患者人次数占同期住院患者总人次数的比例。", "formula": "使用静脉输液的住院患者人次数\n住院患者静脉输液使用率= ×100%\n同期住院患者总人次数", "significance": "反映住院患者静脉输液的使用情况。\n（二）住院患者静脉输液床日占比（PHA-06-02）", "notes": "1.静脉输液是指静脉给药≥50mL的用药行为，包括静脉滴注和泵入等。对\n于某些特殊患者（如儿童、新生儿、肾病等对液体输入量有限制的患者）静脉输液的使\n用量低于50mL 时，仍属于静脉输液，纳入统计范围。\n2.本指标统计治疗性静脉输液，排除单纯用于诊断评估的静脉给药行为，下同。\n3.同一位患者一次住院期间使用1种或多种静脉输注药物，记为1人次数。\n4.使用静脉输液的住院患者人次数和住院患者总人次数均以统计周期内\"出院患\n者\"的人次数计算。统计周期内同一位患者住院2次，应记为2人次，下同。", "category": "药事管理专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 597, "full_text": "住院患者静脉用药情况\n定义：使用静脉输液的住院患者人次数占同期住院患者总人次数的比例。\n计算公式：使用静脉输液的住院患者人次数\n住院患者静脉输液使用率= ×100%\n同期住院患者总人次数\n意义：反映住院患者静脉输液的使用情况。\n（二）住院患者静脉输液床日占比（PHA-06-02）\n说明：1.静脉输液是指静脉给药≥50mL的用药行为，包括静脉滴注和泵入等。对\n于某些特殊患者（如儿童、新生儿、肾病等对液体输入量有限制的患者）静脉输液的使\n用量低于50mL 时，仍属于静脉输液，纳入统计范围。\n2.本指标统计治疗性静脉输液，排除单纯用于诊断评估的静脉给药行为，下同。\n3.同一位患者一次住院期间使用1种或多种静脉输注药物，记为1人次数。\n4.使用静脉输液的住院患者人次数和住院患者总人次数均以统计周期内\"出院患\n者\"的人次数计算。统计周期内同一位患者住院2次，应记为2人次，下同。"}, {"name": "住院患者抗菌药物使用情况", "code": "PHA-07", "definition": "使用抗菌药物的住院患者人次数占同期住院患者总人次数的比例。", "formula": "使用抗菌药物的住院患者人次数\n住院患者抗菌药物使用率= ×100%\n同期住院患者总人次数", "significance": "反映住院患者抗菌药物的使用情况。\n（二）住院患者抗菌药物使用强度（DDDs）（PHA-07-02）", "notes": "同一位患者一次住院期间使用1种或多种抗菌药物，记为1人次数。", "category": "药事管理专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 598, "full_text": "住院患者抗菌药物使用情况\n定义：使用抗菌药物的住院患者人次数占同期住院患者总人次数的比例。\n计算公式：使用抗菌药物的住院患者人次数\n住院患者抗菌药物使用率= ×100%\n同期住院患者总人次数\n意义：反映住院患者抗菌药物的使用情况。\n（二）住院患者抗菌药物使用强度（DDDs）（PHA-07-02）\n说明：同一位患者一次住院期间使用1种或多种抗菌药物，记为1人次数。"}, {"name": "严重或新的药品不良反应上报比例", "code": "PHA-08", "definition": "上报的严重或新的药品不良反应例数占同期上报药品不良反应总例数的比例。", "formula": "上报的严重或新的药品不良反应例数\n严重或新的药品不良反应上报比例= ×100%\n同期上报药品不良反应总例数", "significance": "反映医院严重或新的药品不良反应主动报告情况。", "notes": "1.严重药品不良反应：是指因使用药品引起以下损害情形之一的反应：①导\n致死亡；②危及生命；③致癌、致畸、致出生缺陷；④导致显著的或者永久的人体伤残\n或者器官功能的损伤；⑤导致住院或者住院时间延长；⑥导致其他重要医学事件，如不\n进行治疗可能出现上述所列情况的。\n2.新的药品不良反应：是指药品说明书中未载明的不良反应。 或说明书中已有描\n述，但不良反应发生的性质、程度、后果或者频率与说明书描述不一致或者更严重的，\n按照新的药品不良反应处理。", "category": "药事管理专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 599, "full_text": "严重或新的药品不良反应上报比例\n定义：上报的严重或新的药品不良反应例数占同期上报药品不良反应总例数的比例。\n计算公式：上报的严重或新的药品不良反应例数\n严重或新的药品不良反应上报比例= ×100%\n同期上报药品不良反应总例数\n意义：反映医院严重或新的药品不良反应主动报告情况。\n说明：1.严重药品不良反应：是指因使用药品引起以下损害情形之一的反应：①导\n致死亡；②危及生命；③致癌、致畸、致出生缺陷；④导致显著的或者永久的人体伤残\n或者器官功能的损伤；⑤导致住院或者住院时间延长；⑥导致其他重要医学事件，如不\n进行治疗可能出现上述所列情况的。\n2.新的药品不良反应：是指药品说明书中未载明的不良反应。 或说明书中已有描\n述，但不良反应发生的性质、程度、后果或者频率与说明书描述不一致或者更严重的，\n按照新的药品不良反应处理。"}, {"name": "用药错误报告率", "code": "PHA-09", "definition": "报告给医院管理部门的发生用药错误的人次数占同期用药患者总人次数的\n比例。", "formula": "报告给医院管理部门的发生用药错误的人次数\n用药错误报告率= ×100%\n同期用药患者总人次数", "significance": "反映医院用药错误主动报告情况。", "notes": "1.用药错误是指药品在临床使用及管理全过程中出现的、任何可以防范的用\n药疏失，这些疏失可以导致患者发生潜在的或直接的损害。根据发生用药错误后果的严\n重程度将用药错误分为9级，统计C-I级：\nC级：患者已使用，但未造成伤害。\nD级：患者已使用，需要监测错误对患者的后果，并根据后果判断是否需要采取措\n施预防和减少伤害。\nE 级：错误造成患者暂时性伤害，需要采取处置措施。\nF 级：错误对患者的伤害可导致患者住院或延长患者住院时间。\nG 级：错误导致患者永久性伤害。\nH级：错误导致患者生命垂危，须采取维持生命的措施（如心肺复苏、除颤、插\n管等）。\nI级：错误导致患者死亡。\n2.同期用药患者总人次数指调查时间范围内门诊、急诊 和住院患者用药人次数总和。", "category": "药事管理专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 600, "full_text": "用药错误报告率\n定义：报告给医院管理部门的发生用药错误的人次数占同期用药患者总人次数的\n比例。\n计算公式：报告给医院管理部门的发生用药错误的人次数\n用药错误报告率= ×100%\n同期用药患者总人次数\n意义：反映医院用药错误主动报告情况。\n说明：1.用药错误是指药品在临床使用及管理全过程中出现的、任何可以防范的用\n药疏失，这些疏失可以导致患者发生潜在的或直接的损害。根据发生用药错误后果的严\n重程度将用药错误分为9级，统计C-I级：\nC级：患者已使用，但未造成伤害。\nD级：患者已使用，需要监测错误对患者的后果，并根据后果判断是否需要采取措\n施预防和减少伤害。\nE 级：错误造成患者暂时性伤害，需要采取处置措施。\nF 级：错误对患者的伤害可导致患者住院或延长患者住院时间。\nG 级：错误导致患者永久性伤害。\nH级：错误导致患者生命垂危，须采取维持生命的措施（如心肺复苏、除颤、插\n管等）。\nI级：错误导致患者死亡。\n2.同期用药患者总人次数指调查时间范围内门诊、急诊 和住院患者用药人次数总和。"}, {"name": "标本类型错误率", "code": "CL-01", "definition": "类型不符合要求的标本数占同期标本总数的比例。", "formula": "类型不符合要求的标本数\n标本类型错误率= ×100%\n同期标本总数", "significance": "反映所采集标本的类型符合要求的情况。", "notes": "", "category": "临床检验专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 601, "full_text": "标本类型错误率\n定义：类型不符合要求的标本数占同期标本总数的比例。\n计算公式：类型不符合要求的标本数\n标本类型错误率= ×100%\n同期标本总数\n意义：反映所采集标本的类型符合要求的情况。"}, {"name": "标本容器错误率", "code": "CL-02", "definition": "采集容器不符合要求的标本数占同期标本总数的比例。", "formula": "采集容器不符合要求的标本数\n标本容器错误率= ×100%\n同期标本总数", "significance": "反映用于采集标本的容器符合要求的情况。", "notes": "", "category": "临床检验专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 602, "full_text": "标本容器错误率\n定义：采集容器不符合要求的标本数占同期标本总数的比例。\n计算公式：采集容器不符合要求的标本数\n标本容器错误率= ×100%\n同期标本总数\n意义：反映用于采集标本的容器符合要求的情况。"}, {"name": "标本采集量错误率", "code": "CL-03", "definition": "采集量不符合要求的标本数占同期标本总数的比例。", "formula": "采集量不符合要求的标本数\n标本采集量错误率= ×100%\n同期标本总数", "significance": "反映标本采集量符合要求的情况。", "notes": "", "category": "临床检验专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 603, "full_text": "标本采集量错误率\n定义：采集量不符合要求的标本数占同期标本总数的比例。\n计算公式：采集量不符合要求的标本数\n标本采集量错误率= ×100%\n同期标本总数\n意义：反映标本采集量符合要求的情况。"}, {"name": "血培养污染率", "code": "CL-04", "definition": "污染的血培养套数占同期血培养总套数的比例。", "formula": "污染的血培养套数\n血培养污染率= ×100%\n同期血培养总套数", "significance": "反映血培养过程操作的正确性。", "notes": "一套血培养指一个患者一个穿刺点采集的一套样本。", "category": "临床检验专业医疗质量控制指标（2025年版）", "type": "专业（专科）类", "tables_html": [], "sub_indicators": [], "id": 604,
